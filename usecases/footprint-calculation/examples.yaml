# Example overrides for the footprint-calculation distribution.
#
# Replaces (as a whole, by key) the generic examples in components/examples, and the
# `example` of the listed components/schemas and components/parameters, of
# openapi/ecrop.yaml when this business case is built with
# scripts/build-distribution.py. Every component listed must exist in that distribution.
#
# GreenlinQdata is the crop registration platform of this example. Identifier schemes used:
#   nl.greenlinqdata.*  ids assigned by the platform (the id and third party id of the footprint declaration)
#   nl.kvk.*, com.gs1.*  grower and location identifications (KVK number, GLN)
#   com.iperen.*         ids of the supplier of the fertilizer (article number)

