    CropDetails:
      title: Crop details
      description: 'The details of the cultivation of a specific crop type (e.g. potato, wheat, rice,. etc.) on one or more plots during a specific period of time, specified by startDateTime and endDateTime.'
      allOf:
        - $ref: '#/components/schemas/AssetDetails'
        - type: object
          required:
            - year
            - plantSpecies
          properties:
            year:
              type: integer
              format: int32
              description: Indication of the year in which the cultivation is harvested.
            country:
              description: 'Country where crop is grown. Code list: ISO country code: 2 letter ISO-3166.'
              allOf:
                - $ref: '#/components/schemas/CountryCodeType'
            region:
              type: string
              description: Region of a country the cultivation took place.\nFor eCrop in The Netherlands for this code list code list nl.cl044 is used.
            useTitle:
              description: Code to indicate the type of legal ownership of the field that is used for the crop. For eCrop in The Netherlands code list nl.cl412 is used for this
              allOf:
                - $ref: '#/components/schemas/CodeType'
            productionType:
              description: 'Indicates the intensity of growing the crop. In The Netherlands used to report to the MLNV-RVO authority. Code list: nl.cl255'
              allOf:
                - $ref: '#/components/schemas/CodeType'
            productionPurpose:
              description: 'Indicator of the produce purpose the crop. For instance: fresh marked, animal feed, seed production, etc. Code list: nl.cl251'
              allOf:
                - $ref: '#/components/schemas/CodeType'
            productionSequence:
              $ref: '#/components/schemas/ProductionSequenceType'
            regularOrOrganic:
              description: 'Production protocol: indicates whether this crop is classified as grown organic or non-organic. Code list: nl.cl015'
              allOf:
                - $ref: '#/components/schemas/CodeType'
            netArea:
              description: 'The net (netto) area (in m2, hectare, etc.) of the surface that is used for growing the crop.'
              allOf:
                - $ref: '#/components/schemas/MeasurementType'
            growEnvironment:
              description: 'Indicates in what type of environment the crop is grown; e.g. in the open air, in a greenhouse, etc. Code list: nl.cl299'
