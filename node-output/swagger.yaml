  "components" : {
    "schemas" : {
      "version" : {
        "required" : [ "major", "minor", "patch" ],
        "type" : "object",
        "properties" : {
          "major" : {
            "type" : "integer",
            "description" : "Major.",
            "format" : "int32"
          },
          "minor" : {
            "type" : "integer",
            "description" : "Minor.",
            "format" : "int32"
          },
          "patch" : {
            "type" : "integer",
            "description" : "Patch.",
            "format" : "int32"
          }
        },
        "additionalProperties" : false,
        "description" : "Version of the API based on semver notation"
      },
      "error" : {
        "required" : [ "status", "title", "type" ],
        "type" : "object",
        "properties" : {
          "type" : {
            "type" : "string"
          },
          "title" : {
            "type" : "string"
          },
          "status" : {
            "type" : "integer",
            "format" : "int32"
          },
          "detail" : {
            "type" : "string",
            "nullable" : true
          },
          "instance" : {
            "type" : "string",
            "nullable" : true
          }
        },
        "description" : ""
      },
      "identifier" : {
        "required" : [ "id", "schemaIdType" ],
        "type" : "object",
        "properties" : {
          "id" : {
            "minLength" : 1,
            "type" : "string",
            "description" : "Identifier value.",
            "default" : "12345"
          },
          "schemaIdType" : {
            "minLength" : 1,
            "type" : "string",
            "description" : "Schema type.",
            "default" : "MPS"
          }
        },
        "additionalProperties" : false,
        "description" : "Representation of an identifier."
      },
      "party" : {
        "title" : "Party",
        "required" : [ "id", "name", "personName" ],
        "type" : "object",
        "properties" : {
          "id" : {
            "type" : "string",
            "format" : "uuid",
            "example" : "d290f1ee-6c54-4b01-90e6-d701748f0851"
          },
          "partyId" : {
            "$ref" : "#/components/schemas/identifier"
          },
          "name" : {
            "type" : "string",
            "example" : "VOF De Lier"
