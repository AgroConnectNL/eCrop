              - $ref: '#/components/schemas/ProblemDetails'
              - example:
                  status: 503
                  title: Service Unavailable
                  detail: The service is temporarily unable to handle the request. Please retry later.
      headers:
        API-Version:
          $ref: '#/components/headers/API-Version'
        Request-Id:
          $ref: '#/components/headers/Request-Id'
        Request-Date-Time:
          $ref: '#/components/headers/Request-Date-Time'
