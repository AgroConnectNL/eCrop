        cityName:
          type: string
          description: City name
        streetName:
          type: string
          description: Street name
        streetNumber:
          type: string
          description: Street number
        streetNumberExtension:
          type: string
          description: Extension to the street number (e.g. an addition letter or suffix)
        country:
          $ref: '#/components/schemas/CountryCodeType'
        countryName:
          type: string
          description: Country name
        postalBoxId:
          type: string
          description: Postal box number
    # additionalProperties: false
    PostalAddressType:
      title: Postal Address Type
      description: Specific ype for postal addresses
      allOf:
        - $ref: '#/components/schemas/AddressType'
    VisitorsAddressType:
      title: Visitors Address Type
      description: Specific ype for visitor addresses
      allOf:
        - $ref: '#/components/schemas/AddressType'
    PlotType:
      title: Plot Type
      enum:
        - CROPFIELD
        - ACTIVITYFIELD
        - TABLE
      description: The type of production surface to grow plants. Can be a crop field for arable farming or a moving table (platform) for potted plants in floriculture.
    ProcessStateType:
      title: Process State Type
      enum:
        - PROPOSED
        - PLANNED
        - COMPLETED
      description: 'Indication of the execution status of the task or operation in terms of: proposed, planned, executed. Code list: nl.clL256'
    ProductionSequenceType:
      title: Production Sequence Type
      enum:
        - PRE_CROP
        - MAIN_CROP
        - FOLLOWUP_CROP
        - MIXED_CROP
      description: 'Indicates if and how the crop is combined with other crops. Enumeration: PRE_CROP = voorteelt, MAIN_CROP = hoofdteelt, FOLLOWUP_CROP = volgteelt, MIXED_CROP = mengteelt'
    ##########################################################################
    # Functional schemas (ABIEs, BBIEs and ASBIEs)                           #
    ##########################################################################
    ProblemDetails:
      title: Problem details
      type: object
      description: |-
        Problem details based on the ["Problem Details for HTTP APIs" specification, RFC 9457](https://datatracker.ietf.org/doc/html/rfc9457).

        Remark: According to Proposal NL API Design Rules 2.1 optional properties status, title and detail are required, type and instance are optional
      required:
        - status
        - title
        - detail
      properties:
        status:
          type: integer
          format: int32
          description: The HTTP status code generated by the origin server for this occurrence of the problem.
          minimum: 100
          maximum: 599
        title:
          type: string
          description: 'A short, human-readable summary of the problem type.'
        detail:
          type: string
          description: A human-readable explanation specific to this occurrence of the problem.
        type:
          type: string
          format: uri-reference
          description: A URI reference that identifies the problem type.
        instance:
          type: string
          format: uri-reference
          description: A URI reference that identifies the specific occurrence of the problem. It may or may not yield further information if dereferenced.
        errors:
          type: array
          description: |
            List of individual validation errors, allowing multiple issues encountered while processing the request to be reported together in a single response (per AASG rule H007). This is an AASG-specific extension member of RFC 9457 Problem Details, not part of the base RFC itself.
          items:
            type: object
