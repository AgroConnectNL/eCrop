    CropDetails:
      title: Crop details
      description: 'The details of the cultivation of a specific crop type (e.g. potato, wheat, rice,. etc.) on one or more plots during a specific period of time, specified by startDateTime and endDateTime.'
      allOf:
        - $ref: '#/components/schemas/AssetDetails'
