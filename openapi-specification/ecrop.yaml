        name: Movento 100 SC - 1L - spirotetramat
    EquipmentDetail:
      title: Equipment detail
      type: object
      description: 'Details of equipment used to support farming activities, such as tractors, implements, sensor systems, installations, or hand tools.'
      required:
        - thirdPartyIds
        - type
      properties:
        thirdPartyIds:
          allOf:
            - $ref: '#/components/schemas/ThirdPartyIdsType'
          description: 'List of alternative identifiers (\"AKA, also-know-as\") with which the equipment is identified by third parties, e.g. GS1 GTIN, CGTB authorisation number, article code'''
        name:
          type: string
          description: Name of the equipment
        type:
          type: string
          description: Type of equipment
          enum:
            - Tractor
            - Implement
            - Sensorsystem
            - Installation
            - Handtool
      example:
        thirdPartyIds:
          - content: '8922'
            schemeId: com.iperen.codelist.artikelnummer
        name: John Deere 6120M
        type: Tractor
    EquipmentAssignment:
      title: Equipment assignment
      type: object
      description: Identifies a piece of equipment that is used in a certain operation, and the period and usage figures of that use.
      required:
        - equipment
        - startDateTime
        - endDateTime
      properties:
        equipment:
          description: The equipment assigned to and used in the operation.
          allOf:
            - $ref: '#/components/schemas/EquipmentDetail'
        startDateTime:
          description: The date/timestamp the equipment started being used in the operation.
          allOf:
            - $ref: '#/components/schemas/DateTimeType'
        endDateTime:
          description: The date/timestamp the equipment stopped being used in the operation.
          allOf:
            - $ref: '#/components/schemas/DateTimeType'
        time:
          description: The total time the equipment was in use during the operation (e.g. working hours or engine hours).
          allOf:
            - $ref: '#/components/schemas/MeasureType'
        coveredDistance:
          description: The total distance covered by the equipment during the operation.
          allOf:
            - $ref: '#/components/schemas/MeasureType'
      example:
        equipment:
          thirdPartyIds:
            - content: '1234'
              schemeId: com.my-mps.codelist.registratienummer
          name: John Deere 6120M
          type: Tractor
        startDateTime: '2025-03-12T15:51:00+01:00'
        endDateTime: '2025-03-12T16:45:00+01:00'
        time:
          content: 0.9
          unitCode:
            content: HUR
            listId: nl.agroconnect.codelist.cl020
        coveredDistance:
          content: 3.2
          unitCode:
            content: KMT
            listId: nl.agroconnect.codelist.cl020
    Worker:
      title: Worker
      type: object
      description: A person that performs (part of) an operation, e.g. a farm employee or contractor.
      required:
        - id
        - name
      properties:
        id:
          allOf:
            - $ref: '#/components/schemas/IdType'
          description: Identifier of the worker.
        name:
          type: string
          description: Name of the worker.
        phoneNumber:
          type: string
          description: Phone number of the worker.
        email:
          type: string
          description: E-mail address of the worker.
        jobTitle:
          type: string
          description: Job title of the worker.
      example:
        id:
          content: '4821'
          schemeId: com.my-mps.codelist.medewerkernummer
        name: Jan Jansen
        phoneNumber: +31(0)6 12345678
        email: jan.jansen@example.com
        jobTitle: Machine operator
    WorkAssignment:
      title: Work assignment
      type: object
      description: Identifies a worker that is assigned to a certain operation, and the period and execution time of that assignment.
      required:
        - worker
        - startDateTime
        - endDateTime
      properties:
        worker:
          description: The worker assigned to the operation.
          allOf:
            - $ref: '#/components/schemas/Worker'
        startDateTime:
          description: The date/timestamp the worker started working on the operation.
          allOf:
            - $ref: '#/components/schemas/DateTimeType'
        endDateTime:
          description: The date/timestamp the worker stopped working on the operation.
          allOf:
            - $ref: '#/components/schemas/DateTimeType'
        executionTime:
          description: The total time the worker spent executing the operation.
          allOf:
            - $ref: '#/components/schemas/MeasureType'
      example:
        worker:
          id:
            content: '4821'
            schemeId: com.my-mps.codelist.medewerkernummer
          name: Jan Jansen
          jobTitle: Machine operator
        startDateTime: '2025-03-12T15:51:00+01:00'
        endDateTime: '2025-03-12T16:45:00+01:00'
        executionTime:
          content: 0.9
          unitCode:
            content: HUR
            listId: nl.agroconnect.codelist.cl020
