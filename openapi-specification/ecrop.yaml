  '/growers/{growerSchemeId}/{growerId}/production-locations/{productionLocationSchemeId}/{productionLocationId}/tasks':
    parameters:
      - $ref: '#/components/parameters/Major-Version'
      - $ref: '#/components/parameters/User-Agent'
      - $ref: '#/components/parameters/growerSchemeId'
      - $ref: '#/components/parameters/growerId'
      - $ref: '#/components/parameters/productionLocationSchemeId'
      - $ref: '#/components/parameters/productionLocationId'
    post:
      summary: Register a non crop-specific task with operations on a production location by a grower
      operationId: post-growers-production-locations-tasks
      description: "Register a non crop-specific task with operations on a production location by a grower\r\n\r\nRemarks: repeatingly posting tasks with the same exterenal id will lead to updating the previously posted task (so no duplicates will be generated). \r\nPreferrable, clients should use the PUT operation to update previously POSTed tasks in stead of re-posting them."
