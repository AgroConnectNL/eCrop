tags:
  - name: general
    description: General Operations
  - name: parties
    description: "**Operations on Party-level**\r\n\r\nThese operations are added to this API definition as an example of how basic party information can be exposed to external clients. This can be extended with functions for registering new parties (growers, suppliers) or letting them modify their basic information (name, address, contact info, etc.)"
  - name: plots
    description: "**Plot operations**\r\n\r\nThese operations can be used to retrieve and maintain plot information. Plots are published with there basic information and geometry according to the OGC JSON FG"
  - name: plot-geometry
    description: "**Plot geo-information operations (OGC API Features / JSON-FG)**\r\n\r\nThese operations expose the geo-information of plots (boundary, entryPoint, abLine) as an OGC API Features-compliant, JSON-FG capable API: a landing page, conformance declaration, collection metadata, and Feature/FeatureCollection resources."
  - name: crops
    description: "**Crop operations**\r\n\r\nThese operations can be used to retrieve and maintain crop information."
  - name: delivery
    description: "**Inbound Delivery Operations**\r\n\r\nThese operations can be used for registering products which have been delivered to a grower by a supplier. Suppliers can only register deliveries for growers they are granted for, which they can check with the GET operations in this section (optional). Alternatively growers can register their inboud-deliveries themselves"
  - name: farm level registration
    description: "**Farm level registration Operations**\r\n\r\n Growers can use these operations to register (non-crop related-) tasks and operations on **farm** level"
  - name: plot level registration
    description: "**Plot level registration Operations**\r\n\r\n Growers can use these operations to register (non-crop related-) tasks and operations on **plot** level"
  - name: crop level registration
    description: "**Crop level registration Operations**\r\n\r\n Growers can use these operations to register **crop related** tasks and operations"
paths:
  /health:
    parameters:
      - $ref: '#/components/parameters/Major-Version'
      - $ref: '#/components/parameters/User-Agent'
    get:
      summary: Returns health check of this API
      operationId: get-health
      description: |-
        This endpoint provides health status information about the API service, its dependencies, and overall operational condition. It is designed to be used by monitoring tools, load balancers, and orchestration systems to determine if the service is available and ready to process requests.

        **Checks (examples):**
        - Validator (function) app available?
        - API datastore available?
        - Servicebus available? 

        **Usage:**   
        - **Monitoring:** Used by system administrators and automated monitoring to ensure service availability.
      tags:
        - general
      responses:
        '200':
          $ref: '#/components/responses/health_200'
        '400':
          $ref: '#/components/responses/default_400'
        '401':
          $ref: '#/components/responses/default_401'
        '500':
          $ref: '#/components/responses/default_500'
        '503':
          $ref: '#/components/responses/health_503'
        default:
          $ref: '#/components/responses/default_error'
  /growers:
    parameters:
      - $ref: '#/components/parameters/Major-Version'
      - $ref: '#/components/parameters/User-Agent'
    get:
      tags:
        - parties
      summary: Get all growers for which the client is authorized
      operationId: get-growers
      description: |
        Returns a list with all growers which the requesting client has access to. When called by a grower, his own data will be returned
      parameters:
        - $ref: '#/components/parameters/offset'
        - $ref: '#/components/parameters/limit'
      responses:
        '200':
          $ref: '#/components/responses/growers_200'
        '400':
          $ref: '#/components/responses/default_400'
        '401':
          $ref: '#/components/responses/default_401'
        '500':
          $ref: '#/components/responses/default_500'
        default:
          $ref: '#/components/responses/default_error'
  '/growers/{growerSchemeId}/{growerId}':
    parameters:
      - $ref: '#/components/parameters/Major-Version'
      - $ref: '#/components/parameters/User-Agent'
      - $ref: '#/components/parameters/growerSchemeId'
      - $ref: '#/components/parameters/growerId'
    get:
      tags:
        - parties
      summary: Get a specific grower
      operationId: get-growers-by-growerId
      description: Returns the data of a specific grower with the requested schemeId and growerId when the requesting client has access to these.
      responses:
        '200':
          $ref: '#/components/responses/grower_200'
        '400':
          $ref: '#/components/responses/default_400'
        '401':
          $ref: '#/components/responses/default_401'
        '404':
          $ref: '#/components/responses/default_404'
        '500':
          $ref: '#/components/responses/default_500'
        default:
          $ref: '#/components/responses/default_error'
  /suppliers:
    parameters:
      - $ref: '#/components/parameters/Major-Version'
      - $ref: '#/components/parameters/User-Agent'
    get:
      tags:
        - parties
      summary: Get all supliers for which the client is authorized
      operationId: get-suppliers
      description: Returns a list with all suppliers which the requesting client has access to.
      parameters:
        - $ref: '#/components/parameters/offset'
        - $ref: '#/components/parameters/limit'
      responses:
        '200':
          $ref: '#/components/responses/suppliers_200'
        '400':
          $ref: '#/components/responses/default_400'
        '401':
          $ref: '#/components/responses/default_401'
        '500':
          $ref: '#/components/responses/default_500'
        default:
          $ref: '#/components/responses/default_error'
  '/suppliers/{supplierSchemeId}/{supplierId}':
    parameters:
      - $ref: '#/components/parameters/Major-Version'
      - $ref: '#/components/parameters/User-Agent'
      - $ref: '#/components/parameters/supplierSchemeId'
      - $ref: '#/components/parameters/supplierId'
    get:
      tags:
        - parties
      operationId: get-suppliers-by-supplierId
      summary: Get a specific supplier
      description: Returns the data of a specific supplier with the requested idType and id when the requesting client has access to these.
      responses:
        '200':
          $ref: '#/components/responses/supplier_200'
        '400':
          $ref: '#/components/responses/default_400'
        '401':
          $ref: '#/components/responses/default_401'
        '404':
          $ref: '#/components/responses/default_404'
        '500':
          $ref: '#/components/responses/default_500'
        default:
          $ref: '#/components/responses/default_error'
  '/growers/{growerSchemeId}/{growerId}/inbound-deliveries':
    parameters:
      - $ref: '#/components/parameters/Major-Version'
      - $ref: '#/components/parameters/User-Agent'
      - $ref: '#/components/parameters/growerSchemeId'
      - $ref: '#/components/parameters/growerId'
    post:
      summary: Register an inbound delivery by a grower
      operationId: post-grower-inbound-deliveries
      description: Register an inbound delivery of a product by grower
      tags:
        - delivery
      requestBody:
        $ref: '#/components/requestBodies/inboundDeliveryRequestByGrower'
      responses:
        '202':
          $ref: '#/components/responses/inboundDeliveryGrower_202'
        '400':
          $ref: '#/components/responses/default_400'
        '401':
          $ref: '#/components/responses/default_401'
        '403':
          $ref: '#/components/responses/default_403'
        '500':
          $ref: '#/components/responses/default_500'
        default:
          $ref: '#/components/responses/default_error'
  '/growers/{growerSchemeId}/{growerId}/inbound-deliveries/{inboundDeliverySchemeId}/{inboundDeliveryId}':
    parameters:
