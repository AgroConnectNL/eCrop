        default:
          $ref: '#/components/responses/default_error'
  '/suppliers/{supplierSchemeId}/{supplierId}/growers':
    parameters:
      - $ref: '#/components/parameters/Major-Version'
      - $ref: '#/components/parameters/User-Agent'
      - $ref: '#/components/parameters/supplierSchemeId'
      - $ref: '#/components/parameters/supplierId'
    get:
      summary: Get all growers for a suppliers
      operationId: get-suppliers-growers
      description: Returns all growers for which a supplier is autorised
      tags:
        - delivery
      parameters:
        - $ref: '#/components/parameters/offset'
        - $ref: '#/components/parameters/limit'
      responses:
        '200':
          $ref: '#/components/responses/growers_200'
        '400':
          $ref: '#/components/responses/default_400'
        '401':
          $ref: '#/components/responses/default_401'
        '500':
