    PlantSpecies:
      title: Plantspecies
      type: object
      description: |-
        Crop type at the level of potato, sugar beet, onion, winter wheat, etc.
        For mixed crops more then one type of crop can be grown in the same period at the same plot.
      required:
        - plantSpecies
        - variety
      properties:
        species:
          description: 'Code of the plant species, at the aggregation level of potato, sugar beet, onion, etc. For eCrop in The Netherlands, code list nl.cl263 is used for crop species.'
          type: string
        variety:
          description: Identification of the variety of the type of crop that is grown. For eCrop in The Netherlands code list nl.cl232 is used.
          type: string
        precentageMix:
          description: To be used in case of a mixed crop. Indicator of the percentage of this crop species related to the other crop species that are part of this mixed crop. The percentage is based on the weight proportions of the seed of each of the species that are part of the mixed crop.
          type: number
          format: float
    Plot:
      title: Plot
      description: |-
        Surface (area) that is used to grow plants.
        The exact location of this surface is specified by either, a greenhouse-location a point location or a border location (using outer and inner polygons).
      allOf:
        - allOf:
            - $ref: '#/components/schemas/PrimaryId'
            - example:
                id:
                  content: e7f8a9b0-1c2d-3e4f-5a6b-7c8d9e0f1a2b
                  schemeId: com.my-mps.codelist.guid
        - $ref: '#/components/schemas/PlotDetails'
    PlotDetails:
      title: Plot details
      description: |-
        Details of the Surface (area) that is used to grow plants.
        The exact location of this surface is specified by either, a greenhouse-location a point location or a border location (using outer and inner polygons).
      allOf:
        - $ref: '#/components/schemas/AssetDetails'
        - type: object
          required:
            - type
            - area
          properties:
            type:
              $ref: '#/components/schemas/PlotType'
            area:
              description: 'The surface (measured in for instance square meters, hectare) of this production plot.'
              allOf:
                - $ref: '#/components/schemas/MeasureType'
            regularOrOrganic:
              description: "Indicates whether this plot is classified for organic production or not.\r\nProduction protocol: indicates whether this plot is classified  for organic production or not.\r\nCode list: nl.cl015"
              allOf:
                - $ref: '#/components/schemas/CodeType'
            localSoilType:
              description: "Code for the soil type, as used for a specific use case.\r\nLocalSoilType code consists of the reference to the code list that is being used plus the code from this code list.\r\nFor eCrop in arable farming in The Netherlands, code list nl.cl405 is used"
              allOf:
                - $ref: '#/components/schemas/CodeType'
            regulatorySoilType:
              description: "Code for the soil type, as subscribed by a regulatory authority (e.g. MLNV-RVO in the Netherlands).\r\nFor eCrop in The Netherlands code list nl.cl405 is used."
              allOf:
                - $ref: '#/components/schemas/CodeType'
            greenhouseLocation:
              $ref: '#/components/schemas/GreenhouseLocationDetails'
