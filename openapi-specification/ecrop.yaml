    Task:
      title: Task
      description: |-
        A Task is the execution of one or more Operation's by a ma-machine-system.
        A 'task' consists of one ore more 'operations' that are closely related but involve different assents and resources. All combined operations need to be carried out well coordinated, to execute the task.
        For instance, the task potato harvesting involves: one tractor pulling the potato harvester, 2 units to take care of the transport of the harvested potatoes to the barn, equipment at the barn to unload the transport units and to bring the produce in the storing place.
      allOf:
        - allOf:
            - $ref: '#/components/schemas/PrimaryId'
            - example:
                id:
                  content: 2b3c4d5e-6f7a-8b9c-0d1e-2f3a4b5c6d7e
                  schemeId: com.my-mps.codelist.guid
        - $ref: '#/components/schemas/TaskDetails'
    TaskDetails:
      title: Task details
      type: object
      description: |-
        A Task is the execution of one or more Operation's by a ma-machine-system.
        A 'task' consists of one ore more 'operations' that are closely related but involve different assents and resources. All combined operations need to be carried out well coordinated, to execute the task.
        For instance, the task potato harvesting involves: one tractor pulling the potato harvester, 2 units to take care of the transport of the harvested potatoes to the barn, equipment at the barn to unload the transport units and to bring the produce in the storing place.
      required:
        - thirdPartyIds
        - name
        - startDateTime
        - status
        - operations
      properties:
        thirdPartyIds:
          description: 'List of alternative identifiers (\"AKA, also-know-as\") with which the task is identified by third parties.'
          allOf:
            - $ref: '#/components/schemas/ThirdPartyIdsType'
        name:
          type: string
          description: Short name of the task.
        startDateTime:
          description: The date/timestamp of beginning the execution of the task.
          allOf:
            - $ref: '#/components/schemas/DateTimeType'
        endDateTime:
          description: The date/timestamp of the ending of execution the task.
          allOf:
            - $ref: '#/components/schemas/DateTimeType'
        status:
          $ref: '#/components/schemas/ProcessStateType'
        operations:
          type: array
          items:
            $ref: '#/components/schemas/OperationDetails'
      example:
        thirdPartyIds:
          - content: '27575'
            schemeId: com.my-mps.codelist.registratienummer
        name: Spraying task
        startDateTime: '2025-03-12T15:51:00+01:00'
        endDateTime: '2025-03-12T16:45:00+01:00'
        status: PROPOSED
        operations:
          - thirdPartyIds:
              - content: 27575-1
                schemeId: MPS
            name: Spraying operation
            startDateTime: '2025-03-12T15:51:00+01:00'
            endDateTime: '2025-03-12T16:45:00+01:00'
            type:
              content: SPRAYING
              listId: nl.agroconnect.codelist.cl127
            technique:
              content: SPRAYING
              listId: nl.agroconnect.codelist.cl302
            status: PROPOSED
            area:
              content: 25000
              unitCode:
                content: MTK
                listId: nl.agroconnect.codelist.cl020
            inputAllocations:
              - thirdPartyIds:
                  - content: '52521785'
                    schemeId: com.my-mps.codelist.registratienummer
                name: Movento
                type:
                  content: PROTEC
                  listId: nl.agroconnect.codelist.cl127
                quantity:
                  content: 1200
                  unitCode:
                    content: KGM
                    listId: nl.agroconnect.codelist.cl020
                reason: Bladluis
                product:
                  thirdPartyIds:
                    - content: 838439 N
                      schemeId: nl.ctgb.codelist.toelatingsnummer
                  name: Movento 100 SC - 1L - spirotetramat
                treatmentzone:
                  thirdPartyIds:
