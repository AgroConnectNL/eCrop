    OperationDetails:
      title: Operation details
      type: object
      description: |-
        Activity carried out by man and/or machine as part op the execution of a task. An operation performs a particular OperationTechnique on a particular asset (a crop,a field, a production unit, a batch, etc.) to realize a certain Cultural Practice or Husbandry Practice.
        Examples for CropProduction: The CulturalPractise "weed control"can be realized by one of various OperationTechniques like spraying, row cultivation, manual hoeing, etc.
      required:
        - thirdPartyIds
        - name
        - startDateTime
        - status
      properties:
        thirdPartyIds:
          description: 'List of alternative identifiers (\"AKA, also-know-as\") with which the operation is identified by third parties.'
          allOf:
            - $ref: '#/components/schemas/ThirdPartyIdsType'
        name:
          type: string
          description: Short name of the operation.
        startDateTime:
          description: The date/timestamp of beginning the execution of the operation.
          allOf:
            - $ref: '#/components/schemas/DateTimeType'
        endDateTime:
          description: The date/timestamp of the ending of execution the operation.
          allOf:
            - $ref: '#/components/schemas/DateTimeType'
        type:
          description: 'The type of operation. Code list Id for arable farming: nl.agroconnect.cl127'
          allOf:
            - $ref: '#/components/schemas/CodeType'
        technique:
          description: 'Examples for Crop Production: The CulturalPractise \"weed control\" can be realized by one of various OperationTechniques like spraying, row cultivation, manual hoeing, etc. \r\nCode list Id for arable farming: nl.cl127 (or nl.cl293)'
          allOf:
            - $ref: '#/components/schemas/CodeType'
        status:
          $ref: '#/components/schemas/ProcessStateType'
        characteristics:
          type: array
          description: The option to attach one or more characteristics about the execution of this operation.
          items:
            $ref: '#/components/schemas/CharacteristicType'
        area:
          description: 'The treated area (hectare, m2) during the execution of this operation. Can be a percentage of the total area or an absolute value (like hectare or square meter).'
          allOf:
            - $ref: '#/components/schemas/MeasureType'
        inputAllocations:
          type: array
          description: The option to attach one or more inputs used to execute this operation, such as crop protection products, fertilizer, water, energy, or labor.
          items:
            $ref: '#/components/schemas/InputAllocationDetails'
        outputAllocations:
          type: array
          description: The option to attach one or more outputs resulting from the execution of this operation, such as harvested produce or energy.
          items:
            $ref: '#/components/schemas/OutputAllocationDetails'
        equipmentAssignments:
          type: array
          description: The option to attach one or more pieces of equipment used to execute this operation.
          items:
            $ref: '#/components/schemas/EquipmentAssignment'
        workerAssignments:
          type: array
          description: The option to attach one or more workers assigned to execute this operation.
          items:
            $ref: '#/components/schemas/WorkAssignment'
    AllocationDetails:
      title: Allocation details
      type: object
      description: Details of the generic class (the parent) for input and output allocation.
      required:
        - thirdPartyIds
        - type
        - quantity
        - product
      properties:
        thirdPartyIds:
          description: 'List of alternative identifiers (\"AKA, also-know-as\") with which the allocation is identified by third parties.'
          allOf:
            - $ref: '#/components/schemas/ThirdPartyIdsType'
        name:
          description: Short name for this allocation.
          type: string
        type:
          description: "Indicator for the type of input or output that is used or delivered by this operation. For instance: \r\n- \"FERTIL\" = fertilizer\r\n- \"PROTEC\" = crop protection product\r\n- \"ENERG\" = energy, etc. \r\nFor this AgroConnect code list nl.cl271 is used."
          allOf:
            - $ref: '#/components/schemas/CodeType'
        quantity:
          description: 'Quantity of the allocation measured in absolute terms, meaning for instance applied liters or kilogram in total for this allocation (so not in liter/hectare of kilogram/hectare).'
          allOf:
            - $ref: '#/components/schemas/MeasureType'
        characteristics:
          type: array
          items:
            $ref: '#/components/schemas/CharacteristicType'
        product:
          description: Product used as allocation in this operation
          allOf:
            - $ref: '#/components/schemas/ProductDetails'
    InputAllocationDetails:
      title: Inputallocation details
      description: |-
        One or more inputs used to execute this operation.
        Examples of types of input are: crop protection products, fertilizer, water, energy, labor, etc.
      allOf:
        - $ref: '#/components/schemas/AllocationDetails'
        - type: object
          required:
            - treatmentzone
          properties:
            treatmentzone:
              $ref: '#/components/schemas/TreatmentZoneDetails'
    OutputAllocationDetails:
      title: Outputallocation details
      description: |-
        One or more outputs as the result of the execution of the operation.
        For example harvested produce: potatoes, onions, flowers, vegetables, etc.
        But an output could also be for instance energy.
      allOf:
        - $ref: '#/components/schemas/AllocationDetails'
        - type: object
          required:
            - treatmentzone
          properties:
            treatmentzone:
              $ref: '#/components/schemas/TreatmentZoneDetails'
    TreatmentZoneDetails:
      title: Treatmentzone details
      description: Part of the plot which is treated in an operation
      type: object
      required:
        - thirdPartyIds
      properties:
        thirdPartyIds:
          description: 'List of alternative identifiers (\"AKA, also-know-as\") with which the treatment zone is identified by third parties.'
          allOf:
            - $ref: '#/components/schemas/ThirdPartyIdsType'
        characteristics:
          type: array
          items:
            $ref: '#/components/schemas/CharacteristicType'
        area:
          $ref: '#/components/schemas/MeasureType'
    InboundDeliveryByGrower:
      title: Inbound Delivery by Grower
      description: |
        Materials and inputs delivered by a supplier to a grower as input for their crop process. An inbound
        delivery describes a certain amount of a certain product acquired by a grower through an order to
        a supplier.
      allOf:
        - allOf:
            - $ref: '#/components/schemas/PrimaryId'
            - example:
                id:
                  content: 6f6d3b8c4-2e7a-4a1d-9b2c-0e1f2a3b4c5d
                  schemeId: com.my-mps.codelist.guid
        - $ref: '#/components/schemas/InboundDeliveryDetailsGrower'
    InboundDeliveryBySupplier:
      title: Inbound Delivery by Supplier
      description: |
        Materials and inputs delivered by a supplier to a grower as input for their crop process. An inbound
        delivery describes a certain amount of a certain product acquired by a grower through an order to
        a supplier.
      allOf:
        - allOf:
            - $ref: '#/components/schemas/PrimaryId'
            - example:
                id:
                  content: 6f6d3b8c4-2e7a-4a1d-9b2c-0e1f2a3b4c5d
                  schemeId: com.my-mps.codelist.guid
        - $ref: '#/components/schemas/InboundDeliveryDetails'
    InboundDeliveryDetailsGrower:
      title: Inbound Delivery details by a Grower
      description: |
        Details of the materials and inputs delivered by a supplier to a grower as input for their crop process. An inbound
        delivery describes a certain amount of a certain product acquired by a grower through an order to
        a supplier.
      allOf:
        - $ref: '#/components/schemas/InboundDeliveryDetails'
        - type: object
          required:
            - supplier
          properties:
            supplier:
              $ref: '#/components/schemas/SupplierDetails'
    InboundDeliveryDetails:
      title: Inbound Delivery details
      type: object
      description: |
        Details of materials and inputs delivered by a supplier to a grower as input for their crop process. An inbound
        delivery describes a certain amount of a certain product acquired by a grower through an order to
        a supplier.
      required:
        - thirdPartyIds
        - dateOfDelivery
        - quantity
        - product
        - location
      properties:
        thirdPartyIds:
          allOf:
            - $ref: '#/components/schemas/ThirdPartyIdsType'
          description: 'List of alternative identifiers (\"AKA, also-know-as\") with which the inbound delivery is identified by third parties.'
        dateOfDelivery:
          allOf:
            - $ref: '#/components/schemas/DateType'
          description: Date at which the product is delivered at the location of the grower ("YYYY-MM-DD")
        quantity:
          allOf:
            - $ref: '#/components/schemas/MeasureType'
          description: Quantity of the product delivered to the grower.
        product:
          $ref: '#/components/schemas/ProductDetails'
        location:
          allOf:
            - $ref: '#/components/schemas/ProductionLocationDetails'
          description: Identification of the production location of the grower at which the product is delivered
