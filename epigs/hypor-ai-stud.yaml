  '/parties/{smsNr}/removals/{removalEventId}/observations':
    post:
      tags:
        - 15-removals
      summary: 151-removals-observations
      description: 'Using this operation, observations on objects will be registered. Observations can consist out of measurements, remarks, etc. Observations can be registered by persons, by sensors, visual etc an object can be an individual animal, a group of animals, the housing of an animal, etc.  An Observation can include an eventReferenceId containing the eventid to which it belongs. Linking an Observation to this referred event is done in back-end processing, the API-platform accepts any eventId here. When omitted, the Observation will be considered as an independent Observation which is NOT related to an other event.'
      operationId: postObservation
      parameters:
        - $ref: '#/components/parameters/smsNr'
        - name: removalEventId
          in: path
          description: 'A unique identifier for the removal event for which the observation has been registered.. This identifier must be a whole number with a maximum length of 10. This unique identifier cannot be re-used within the client software, also not after a DEL operation.'
          required: true
          schema:
            type: string
        - $ref: '#/components/parameters/User-Agent'
        - $ref: '#/components/parameters/Authorization'
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Observation'
            example:
              eventId: '11223355'
              dateOfObservation: '2023-06-06'
              observerTypeCode: 1
              observerId:
                id: John
                idType: 1
              observingTechnique: ''
              observedObject:
                type: 12
                id:
                  id: '114349'
                  idType: 4
                secondaryIds:
                  - idType: 6
                    id: 'Q8T529'
                  - idType: 1
                    id: '117034'
                  - idType: 2
                    id: '47406'
                pigCategoryCode: 13
              characteristicCodeListId: nl.cl550
              observationLines:
                - characteristicCode: '109900'
     # HIER MIST value attribuut in example!
                  numberOfAnimals: 1
      responses:
        '202':
          description: The message is accepted by the backend for further processing
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Observation'
                  - $ref: '#/components/schemas/Metadata'
              example:
                eventId: '11223355'
                dateOfObservation: '2023-06-06'
                observerTypeCode: 1
                observerId:
                  id: John
                  idType: 1
                observingTechnique: ''
                observedObject:
                  type: 12
                  id:
                    id: '114349'
                    idType: 4
                  secondaryIds:
                    - idType: 6
                      id: 'Q8T529'
                    - idType: 1
                      id: '117034'
                    - idType: 2
                      id: '47406'
                  pigCategoryCode: 13
                characteristicCodeListId: nl.cl550
                observationLines:
                  - characteristicCode: '109900'
                    value:
                      measurementUnitCode: NONE
                      measuredValue: 'false'
                    numberOfAnimals: 1
                metadata:
                  senderApplicationId: 123
                  versionNumber: 1.0.0
                  releaseNumber: 1.0.1
                  smsNr: 12345
                  clientId: '123456'
                  requestId: 3f2504e0-4f89-11d3-9a0c-0305e82c3301
                  requestDateTime: '2022-01-01T12:00:00.0000000+00:00'
                  syncId: 3f2504e0-4f89-11d3-9a0c-0305e82c3302
        '400':
          description: When not all required fields are populated (e.g. User-Agent header and payload)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                - memberNames:
                    - AnimalId.Id
                  errorMessage: The value for Id is invalid
                - memberNames:
                    - AnimalId.AnimalIdType
                  errorMessage: The value for Animal Id Type is invalid
                - memberNames:
                    - 'SecondaryAnimalIds[0].AnimalIdType'
                  errorMessage: The value for Animal Id Type is invalid
                - memberNames:
                    - name
                  errorMessage: The name is required when (rearing) boar
        '401':
          description: When connected party is not authorized/allowed to call this api
        '403':
          description: When connected party is not authorized/allowed to call this api for this smsnr
        '500':
          description: When something bad happened on our side
