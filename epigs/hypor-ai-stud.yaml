    Removal:
      required:
        - eventId
        - dateOfRemoval
        - animal
      type: object
      properties:
        eventId:
          type: string
          description: 'A unique identifier for this occurrence of the removal. This identifier must be a whole number with a maximum length of 10. This unique identifier cannot be re-used within the client software, also not after a DEL operation.'
        dateOfRemoval:
          type: string
          description: Date of removal of the animal. Format YYYY-MM-DD
          format: date
        destination:
          required:
            - id
          type: object
          properties:
            id:
              required:
                - id
                - idType
              type: object
              properties:
                id:
                  type: string
                  description: 'The unique identifier of the party, which must not be empty.'
                idType:
                  type: string
                  description: 'The type of the party identifier, which provides additional context about the identifier.'
              description: An object representing a reference to a farm by specifying a party identifier and the type of the identifier.
          description: 'Reference to the party where the animals are moved towards. Preference to use are sms (business location number Hypor), or in case sms is not available use gln. If both are unknown, use the local country governmental registration number. Type values are defined in code list nl.cl709.'
        animal:
          required:
            - id
            - secondaryIds
            - sex
          type: object
          properties:
            sex:
              enum:
                - 1
                - 2
                - 3
                - 4
              type: integer
              description: 'Sex of the animal: 1=female, 2=male, 3=unknown, 4=castrate. Need to be delivered in case this is known.'
            id:
              required:
                - id
                - idType
              type: object
              properties:
                id:
                  type: string
                  description: 'Identification number of the animal (ManagementSystemId, administrative animal number) must be a whole number between 1 and 99999999. Leading zeros are allowed but will be ignored. This unique identifier cannot be re-used with the client software, also not after a DEL operation.'
                idType:
                  type: integer
                  description: 'The type of the id. Possible values: 4 (ManagementSystemId). Type values are defined in code list nl.cl607.'
              description: The id of the animal.
            secondaryIds:
              type: array
              items:
                required:
                  - id
                  - idType
                type: object
                properties:
                  id:
                    type: string
                    description: The secondary ids of the animal
                  idType:
                    type: integer
                    description: 'Secondary identification of the animal. Possible values: 1 (Electronic ChipNumber), 2 (Tagnumber), 6 (TattooNumber). Type 2 (ear tag number) is required. Electronic chip number (type 1) and other types are non-mandatory, but have to be delivered in case they are known. Type values are defined in code list nl.cl607.'
              description: 'Secondary identification of the animal. Type 2 (ear tag number) is obligated. Electronic chip number (type 1) and other types are non-mandatory, but have to be delivered in case they are known. Type values are defined in code list nl.cl607.'
          description: An object representing the detailed information of an animal including primary and secondary IDs and sex
        reasonForRemoval:
          type: integer
          description: 'Basic reason for removal: 1=sold, 2=sold to slaughterhouse, 3=pig(let) internal movement, 4=stillborn, 5=natural dead, 6=euthanized. Type values are defined in code list nl.cl664.'
      description: 'A model for submitting data on animal removal events, capturing the event ID, date of removal, destination farm, detailed animal information, and the reason for the removal.'
      example:
        eventId: '1234567890'
        dateOfRemoval: '2023-06-09'
        destination:
          id:
            id: '2152'
            idType: sms
        animal:
          id:
            id: '171069'
            idType: 4
          secondaryIds:
            - id: 'B4N392'
              idType: 6
            - id: '58921'
              idType: 1
            - id: 'C2459'
              idType: 2
          sex: 2
        reasonForRemoval: 2
    AssessmentData:
      required:
        - items
        - metadata
      type: object
      description: 'Set of assessements with publication/metadata. Remark: use Content-Type: application/hal+json!'
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/Assessment'
          description: 'List of assessments'
        metadata:
          $ref: '#/components/schemas/Publication'
    Assessment:
      required:
        - id
        - dateTimeOfPublication
        - animal
        - characteristicCodeListId
        - assessmentLines
      type: object
      description: 'Assessment data of one animal'
      properties:
        id:
          type: string
          # format: uuid
          description: A unique identifier for the assessment
        dateTimeOfPublication:
          type: string
          format: date-time
          description: 'Datetime  of publication of assessments. dateTimes: returned in “Z”  timezone (+00:00). The timezone Z is the code for Zulu Time which is equal to UTC (Coordinated Universal Time, +00:00). '
        characteristicCodeListId:
          type: string
          description: 'Reference of the code list with breeding characteristics. We restrict ourselves to nl.cl644. '
        animal:
          required:
            - id
            - secondaryIds
          type: object
          properties:
            id:
              required:
                - id
                - idType
              type: object
              properties:
                id:
                  type: string
                  description: 'Identification number of the animal (ManagementSystemId, administrative animal number) must be a whole number between 1 and 99999999. Leading zeros are allowed but will be ignored. This unique identifier cannot be re-used with the client software, also not after a DEL operation.'
                idType:
                  type: integer
                  description: 'The type of the id. Possible values: 4 (ManagementSystemId). Type values are defined in code list nl.cl607. '
              description: The id of the animal.
            secondaryIds:
              type: array
              items:
                required:
                  - id
                  - idType
                type: object
                properties:
                  id:
                    type: string
                    description: The secondary ids of the animal
                  idType:
                    type: integer
                    description: 'Secondary identification of the animal. Possible values: 1 (Electronic ChipNumber), 2 (Tagnumber), 6 (TattooNumber). Type 2 (ear tag number) is required. Electronic chip number (type 1) and other types are non-mandatory, but have to be delivered in case they are known. Type values are defined in code list nl.cl607.'
              description: The secondary ids of the animal.
        assessmentLines:
          type: array
          items:
            $ref: '#/components/schemas/AssessmentLine'
    AssessmentLine:
      required:
        - characteristicCode
        - dateOfDetermination
        - characteristicValue
      type: object
      description: 'Single assessment line with one characteristic.'
      properties:
        characteristicCode:
          type: string
          description: 'The code, picked from the indicated list (characteristicCodeListId) of characteristics.'
        dateOfDetermination:
          type: string
          format: date
          description: 'The date on which the animal or piglet got the assessment. This field must have a non-default date value. Format YYYY-MM-DD'
        characteristicValue:
          $ref: '#/components/schemas/CharacteristicValue'
    Observation:
      required:
        - eventId
        - dateOfObservation
        - observedObject
        - characteristicCodeListId
        - observationLines
      type: object
      properties:
        eventId:
          type: string
          description: 'A unique identifier for this occurrence of the observation. This identifier must be a whole number with a maximum length of 10. This unique identifier cannot be re-used within the client software, also not after a DEL operation.'
        dateOfObservation:
          type: string
          description: Date of the moment the observation took place. Format YYYY-MM-DD
          format: date
        observerTypeCode:
          enum:
            - 1
            - 2
            - 3
            - 4
            - 5
            - 6
          type: integer
          description: 'Indicator of the type of observer that made the observation. E.g. 1=person,2=climate control system, 3=feeding system, 4=weighing system, 5=video system, 6=counting system, etc.'
        observerId:
          required:
            - id
            - idType
          type: object
          properties:
            id:
              type: string
              description: The identifier of the observer. E.g. the identifier of a person or of a sensor system. The value of the observer identifier.
            idType:
              enum:
                - 1
                - 2
                - 3
              type: integer
              description: 'Indicator of what type of identifier is used to identify the observer or the observing device. E.g. 1=person''s ID, 2=RFID, 3=identifier of a device).'
          description: The identifier of the observer. E.g. the identifier of a person or of a sensor system.
        observingTechnique:
          type: string
          description: Indication of how the observation was made. In case of a device this could be a specific version of a specific brand.
        observedObject:
          required:
            - id
            - type
          type: object
          properties:
            id:
              required:
                - id
                - idType
              type: object
              properties:
                id:
                  type: string
                  description: 'The unique identifier of the animal. This field is required when observedObject.type is 12. For type 4 (ManagementSystemId,  administrative animal number) the id must  be a whole number between 1 and 99999999. Leading zeros are allowed but will be ignored. This unique identifier cannot be re-used with the client software, also not after a DEL operation.'
                idType:
                  enum:
                    - 1
                    - 2
                    - 4
                    - 6
                  type: integer
                  description: 'In case observedObject.type = 12, then observedObject.id.idType must be 4 - Management system id (administrative animal number). '
              description: 'The identifier of the object that is being observed. E.g. the identifier of the animal, of a group of animals, a barn or a section. Value (the actual code) of this id. We restrict ourselves to identifier of the animal. Needs to be of type 4 (administrative animal number). Type values are defined in code list nl.cl607.'
            secondaryIds:
              type: array
              items:
                required:
                  - id
                  - idType
                type: object
                properties:
                  id:
                    type: string
                    description: The unique identifier of the animal. This field is required when observedObject.type is 12.
                  idType:
                    enum:
                      - 1
                      - 2
                      - 4
                      - 6
                    type: integer
                    description: 'In case observedObject.type = 12, then observedObject.secondaryIds[].idType can be 1, 2, 5 or 6. (Secondary identification of the animal). For identifications-observations Type 5 (Plastic number (piglet birth tag)) is required. Type 1 and 6 are optional and Type 2 is not allowed. For all other observations Type 2 (ear tag number) is required. Electronic chip number (type 1) and other types are non-mandatory but have to be delivered in case they are known. All Type values are defined in code list nl.cl607.'
              description: 'A secondary identifier of the object that is being observed. E.g. the identifier of the animal, of a group of animals, a barn or a section. Value (the actual code) of this id. We restrict ourselves to identifier of the animal. Type 6 (Hypor tattoo number) and type 2 (ear tag number) are obligated. Electronic chip number (type 1) and other types are non-mandatory, but have to be delivered in case they are known. Type values are defined in code list nl.cl607.'
            type:
              enum:
                - 10
                - 12
                - 14
                - 16
                - 18
                - 20
                - 30
              type: integer
              description: 'Indicator of the type of object that is being observed. E.g. 10=animal group, 12=individual animal, 14=animal house, 16=animal section, 18=animal pen, 20=batch of animals, 30=litter, etc. We restrict ourselves to 12 and 30. When observedObjectType is 12, we expect observedObjectId and observedObjectSecondaryIds should be non-empty. When observedObjectType is 30, we expect observedObjectId and observedObjectSecondaryIds to be empty. But observedObject.litterNumber and observedObject.mother need to be filled.'
            pigCategoryCode:
              type: integer
              description: Indication of the stage in the animal's life cycle. Type values are defined in code list nl.cl663.
            litterNumber:
              type: integer
              description: Litter number associated with the animal if applicable.
            mother:
              required:
                - id
              type: object
              properties:
                id:
                  required:
                    - id
                    - idType
                  type: object
                  properties:
                    id:
                      type: string
                      description: 'In case observedObject.type = 30, the id of the mother. (ManagementSystemId,  administrative animal number) is required. This id must  be a whole number between 1 and 99999999. Leading zeros are allowed but will be ignored. This unique identifier cannot be re-used with the client software, also not after a DEL operation.'
                    idType:
                      enum:
                        - 1
                        - 2
                        - 4
                        - 6
                      type: integer
                      description: 'In case observedObject.type = 30, the primary id of the mother is required and equal to 4 - Management system id (administrative animal number).'
                  description: The id of the mother.
                secondaryIds:
                  type: array
                  items:
                    required:
                      - id
                      - idType
                    type: object
                    properties:
                      id:
                        type: string
                        description: 'In case observedObject.type = 30, the secondary id of the mother is required '
                      idType:
                        enum:
                          - 1
                          - 2
                          - 4
                          - 6
                        type: integer
                        description: 'In case observedObject.type = 30, the secondary identification of the mother is required. Enum values include: 1 – Electronic chip number, 2 – Tag number, 6 – Tattoonumber. Type 2 (ear tag number) is required. Electronic chip number (type 1) and other types are non-mandatory, but have to be delivered in case they are known. Type values are defined in code list nl.cl607.'
                  description: The secondary ids of the mother.
              description: Reference to the mother of the litter. The value of the identifier of the animal. Needs to be of type 4 (administrative animal number). Type values are defined in code list nl.cl607.
          description: 'A detailed model capturing specific observations of an animal, including type, category, and familial relations, extending basic animal details.'
        characteristicCodeListId:
          type: string
          description: 'Reference of the code list with characteristics that can be observed or measured for this type of observed object. E.g. the reference for the code list of animal characteristics or the identifier of the code list with climate characteristics. F.e. We restrict ourselves to nl.cl550, nl.cl609 and nl.cl645.'
        observationLines:
          type: array
          items:
            required:
              - value
            type: object
            properties:
              characteristicCode:
                type: string
                description: 'The code, picked from the indicated list (characteristicCodeListId) of characteristics. Type values are defined in code list nl.cl609.'
              value:
                type: object
                properties:
                  measurementUnitCode:
                    type: string
                    description: Measurement unit code of the value. Is required if  characteristicCodeListId = nl.cl609. Valid values are defined in code list nl.cl020. Not allowed if characteristicCodeListId = nl.cl550 or nl.cl645.
                  measuredValue:
                    type: string
                    description: Measured value. Is required if  characteristicCodeListId = nl.cl609. Expresses the measured value as a float type. Decimals with dot. Not allowed if characteristicCodeListId = nl.cl550 or nl.cl645.
                description: 'The value observed, including the unit of measurement and the actual measured value.'
              numberOfAnimals:
                type: integer
                description: Number of animals.
            description: 'A model representing a specific observation within a larger study, detailing the characteristic observed, the measured value, and the number of animals involved if applicable.'
          description: 'The code, picked from the indicated list (characteristicCodeListId) of characteristics.'
      description: 'A model for submitting observation data, including details about the event, observer, and the observed object, along with observation techniques and characteristics.'
      example:
        eventId: '11223355'
        dateOfObservation: '2023-06-06'
        observerTypeCode: 1
        observerId:
          id: John
          idType: 1
        observingTechnique: ''
        observedObject:
          type: 12
          id:
            id: '114349'
            idType: 4
          secondaryIds:
            - idType: 6
              id: 'Q8T529'
            - idType: 1
              id: '117034'
            - idType: 2
              id: '47406'
          pigCategoryCode: 13
        characteristicCodeListId: nl.cl550
        observationLines:
          - characteristicCode: '109900'
     # HIER MIST value attribuut in example!
            numberOfAnimals: 1
    SynchronisationPatchRequestModel:
      required:
        - status
      type: object
      properties:
        status:
          enum:
            - 0
            - 1
            - 4
            - 5
          type: integer
          description: 'The status of the synchronisation. There are different statuses, which are used by the vendor to inform Hypor the status of the synchronisation request. Status 1 = started = indicates that the requested synchronisation is initiated by the vendor. Status 4 = completed = when the full synchronisation at the end is successfully sent to Hypor. When an individual request failed but succeeded after retrying it''s still successful.. Status 5 = completed with errors = when the full synchronisation is completed but some of the API''s are not successful (after retrying!) and thus didn''t reach Hypor.'
      description: 'A model for managing synchronization processes, detailing the sync identifier, status, type, and duration.'
      example:
        status: 4
    Synchronisation:
      required:
        - id
        - status
        - syncType
      type: object
      properties:
        id:
          type: string
          description: The GUID for this synchronisation request.
          format: uuid
        status:
          enum:
            - 0
            - 1
            - 4
            - 5
          type: integer
          description: 'The status of the synchronisation. There are different statuses, which are used by the vendor to inform Hypor the status of the synchronisation request. Status 1 = started = indicates that the requested synchronisation is initiated by the vendor. Status 4 = completed = when the full synchronisation at the end is successfully sent to Hypor. When an individual request failed but succeeded after retrying it''s still successful. Status 5 = completed with errors = when the full synchronisation is completed but some of the API''s are not successful (after retrying!) and thus didn''t reach Hypor.'
        syncType:
          type: string
          description: 'The type of synchronisation. Type F = Farm synchronisation. Type A = Animal synchronisation. When Type A, the list of animals is filled. With Type F the list is empty.'
        numberOfDays:
          type: integer
          description: NumberOfDays defines the period of data that is requested in the Farm synchronisation (days back till today). Detailed background information can be found in the “Guiding manual for service providers”.
        animalIds:
          type: array
          items:
            required:
              - id
              - idType
            type: object
            properties:
              id:
                type: string
                description: Identification of the animal. Each id in the payload needs to lead to an animal synchronisation
              idType:
                type: integer
                description: 'The type of the id. Type values are defined in code list CL607. Example of values are: 1 (Electronic ChipNumber), 2 (Tagnumber), 4 (ManagementSystemId, administrative animal number), 5 (Plastic number (piglet birth tag)), 6 (TattooNumber).'
          description: List of animal IDs included in the sync (when syncType=A).
      description: 'A model for managing synchronization processes, detailing the sync identifier, status, type, and duration.'
      example:
        id: 00000000-0000-0000-0000-000000000000
        status: 0
        syncType: A
        animalIds:
          - id: '220376'
            idType: 4
          - id: 'Q8T31'
            idType: 6
          - id: 'Q8T529'
            idType: 6
          - id: '117048'
            idType: 1
