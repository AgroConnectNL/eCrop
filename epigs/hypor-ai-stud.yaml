            schema:
              $ref: '#/components/schemas/Removal'
            example:
              eventId: '1234567890'
              dateOfRemoval: '2023-06-09'
              destination:
                id:
                  id: '2152'
                  idType: sms
              animal:
                id:
                  id: '171069'
                  idType: 4
                secondaryIds:
