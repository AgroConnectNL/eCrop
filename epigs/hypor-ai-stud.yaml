components:
  schemas:
    ErrorResponse:
      type: array
      items:
        $ref: '#/components/schemas/ErrorMessage'
    ErrorMessage:
      required:
        - memberNames
        - errorMessage
      type: object
      properties:
        memberNames:
          type: array
          items:
            type: string
          description: The property on the request object where the errors is applicable
        errorMessage:
          type: string
          description: The error message
    Metadata:
      type: object
      properties:
        senderApplicationId:
          minimum: 1
          type: integer
          description: The unique identifier of the sender application.
        versionNumber:
          type: string
          description: The version number of the application.
        releaseNumber:
          type: string
          description: 'The release number of the application, if applicable.'
        smsNr:
          minimum: 1
          type: integer
          description: The SMS number associated with the payload.
        clientId:
          pattern: '^[1-9][0-9]*$'
          type: string
          description: The client identifier.
        requestId:
          type: string
          description: The unique identifier for this request.
          format: uuid
        requestDateTime:
          type: string
          description: The date and time when the request was made.
          format: date-time
        syncId:
          type: string
          description: The synchronization identifier used in sync APIs.
          format: uuid
      description: Metadata related to the response.
      example:
        metadata:
          senderApplicationId: 123
          versionNumber: 1.0.0
          releaseNumber: 1.0.1
          smsNr: 12345
          clientId: '123456'
          requestId: 3f2504e0-4f89-11d3-9a0c-0305e82c3301
          requestDateTime: '2022-01-01T12:00:00.0000000+00:00'
          syncId: 3f2504e0-4f89-11d3-9a0c-0305e82c3302
    CharacteristicValue:
      type: object
      description: Generic type with characteristics
      oneOf:
        - required:
            - stringValue
          properties:
            stringValue:
              description: 'String value of the characteristic'
              type: string
        - required:
            - booleanValue
          properties:
            booleanValue:
              description: 'Boolean value (true/false) of the characteristic'
              type: boolean
        - required:
            - dateValue
          properties:
            dateValue:
              type: string
              format: date
              description: 'Date value. Expresses the measured value as a date (YYYY-MM-DD).'
        - required:
            - dateTimeValue
          properties:
            dateTimeValue:
              type: string
              format: date-time
              description: 'Datetime value. Expresses the measured value as a datetime (YYYY-MM-DDThh:mm:ssZ or YYYY-MM-DDThh:mm:ss+/-hh:mm).'
        - required:
            - unitCode
            - numberValue
          properties:
            unitCode:
              type: string
              description: 'Measurement unit code of the assessment value. Valid values are defined in code list nl.cl020.'
            numberValue:
              type: number
              format: float
              description: 'Number value. Expresses the measured value as a float type.'
    HalLink:
      type: object
      description: A single HAL link object
      properties:
        href:
          type: string
          format: uri
          description: The target URI of the link
        templated:
          type: boolean
          description: Indicates if the href is a URI template
        type:
          type: string
          description: The media type expected when dereferencing the target resource
        deprecation:
          type: string
          format: uri
          description: A URI indicating that the link relation is deprecated
        name:
          type: string
          description: A secondary key for selecting link which shares the same relation type
        profile:
          type: string
          format: uri
          description: A URI identifying the profile of the target resource
        title:
          type: string
          description: A human-readable title for the link
        hreflang:
          type: string
          description: The language of the target resource
      required:
        - href
    HalLinks:
      type: object
      description: A collection of HAL links, keyed by relation type
      additionalProperties:
        anyOf:
          - $ref: '#/components/schemas/HalLink'
          - type: array
            items:
              $ref: '#/components/schemas/HalLink'
    Publication:
      required:
        - publicationId
        - totalPages
        - currentPage
        - publicationStatus
        - _links
      type: object
      description: Publication of a set of data to be retrieved by a client
      properties:
        publicationId:
          type: string
          description: 'Server side assigned unique id of the published data set. When a client is requesting the first page (no page(number) I query params) this id is returned. Every succeeding request for another page must included the id in the query params '
        totalPages:
          type: number
          format: int32
          minimum: 0
          description: Total number of pages for the complete set of assessments
        currentPage:
          type: number
          format: int32
          minimum: 0
          description: Number of the current page retrieved
        publicationStatus:
          type: number
          format: int32
          description: 'Status of the publication: 1=Current (most recent data version), 2=Obsolete (newer version available)'
        _links:
          allOf:
            - $ref: '#/components/schemas/HalLinks'
          description: 'Link to get the next page from this publication, empty in response of the last page.'
    Introduction:
      required:
        - eventId
        - dateOfIntroduction
        - animal
      type: object
      properties:
        eventId:
          minLength: 1
          type: string
          description: 'A unique identifier for this occurrence of the introduction. This identifier must be a whole number with a maximum length of 10. This unique identifier cannot be re-used within the client software, also not after a DEL operation.'
        dateOfIntroduction:
          type: string
          description: The date of introduction. Format YYYY-MM-DD.
          format: date
        animal:
          required:
            - id
            - secondaryIds
            - dateOfBirth
          type: object
          properties:
            id:
              required:
                - id
                - idType
              type: object
              properties:
                id:
                  type: string
                  description: 'Identification number of the animal (ManagementSystemId, administrative animal number) must be a whole number between 1 and 99999999. Leading zeros are allowed but will be ignored. This unique identifier cannot be re-used with the client software, also not after a DEL operation.'
                idType:
                  type: integer
                  description: 'The type of the id. Possible values: 4 (ManagementSystemId). Type values are defined in code list nl.cl607. '
              description: The id of the animal.
            secondaryIds:
              type: array
              items:
                required:
                  - id
                  - idType
                type: object
                properties:
                  id:
                    type: string
                    description: The secondary ids of the animal
                  idType:
                    type: integer
                    description: 'Secondary identification of the animal. Possible values: 1 (Electronic ChipNumber), 2 (Tagnumber), 6 (TattooNumber). Type 2 (ear tag number) is required. Electronic chip number (type 1) and other types are non-mandatory, but have to be delivered in case they are known. Type values are defined in code list nl.cl607.'
              description: The secondary ids of the animal.
            line:
              required:
                - id
              type: object
              properties:
                id:
                  type: string
                  description: The id of the line.
              description: 'The genetic line of the animal, which can be nullable'
            dateOfBirth:
              type: string
              description: The date when the animal was born. Format YYYY-MM-DD.
              format: date
            mother:
              required:
                - id
              type: object
              properties:
                id:
                  required:
                    - id
                    - idType
                  type: object
                  properties:
                    id:
                      type: string
                      description: The id of the mother.
                    idType:
                      enum:
                        - 1
                        - 2
                        - 4
                        - 6
                      type: integer
                      description: 'The type of the id. Possible values: 6 (TattooNumber). Type values are defined in code list nl.cl607.'
                  description: The id of the mother.
                secondaryIds:
                  type: array
                  items:
                    required:
                      - id
                      - idType
                    type: object
                    properties:
                      id:
                        type: string
                        description: 'The secondary ids of the mother. The id of type 4 (ManagementSystemId, administrative animal number) must be a whole number between 1 and 99999999. Leading zeros are allowed but will be ignored. This unique identifier cannot be re-used with the client software, also not after a DEL operation.'
                      idType:
                        enum:
                          - 1
                          - 2
                          - 4
                          - 6
                        type: integer
                        description: 'The type of the id. Possible values: 1 (ElectronicChipNumber), 2 (TagNumber), 4 (ManagementSystemId). '
                  description: The secondary ids of the mother.
              description: The mother of the animal.
            father:
              required:
                - id
              type: object
              properties:
                id:
                  required:
                    - id
                    - idType
                  type: object
                  properties:
                    id:
                      type: string
                      description: The id of the father.
                    idType:
                      enum:
                        - 1
                        - 2
                        - 4
                        - 6
                      type: integer
                      description: 'The type of the id. Possible values: 6 (TattooNumber). Type values are defined in code list nl.cl607.'
                  description: The id of the father.
                secondaryIds:
                  type: array
                  items:
                    required:
                      - id
                      - idType
                    type: object
                    properties:
                      id:
                        type: string
                        description: 'The secondary ids of the father. The id of type 4 (ManagementSystemId , administrative animal number) must be a whole number between 1 and 99999999. Leading zeros are allowed but will be ignored. This unique identifier cannot be re-used with the client software, also not after a DEL operation.'
                      idType:
                        enum:
                          - 1
                          - 2
                          - 4
                          - 6
                        type: integer
                        description: 'The type of the id. Possible values: 1 (ElectronicChipNumber), 2 (TagNumber), 4 (ManagementSystemId).'
                  description: The secondary ids of the father.
              description: The father of the animal.
            boar:
              required:
                - type
                - name
              type: object
              properties:
                type:
                  type: string
                  description: 'Only required for boars. Kind of boar (NBA=natural mating boar, CAI=artificial insemination, boar not on farm, OAI=artificial insemination, boar on farm, VAB=vasectomized boar). It describes if the boar is physically located at the farm or not.'
                name:
                  type: string
                  description: Only required for boars. The name of the boar.
              description: The boar being introduced.
            sex:
              enum:
                - 1
                - 2
                - 3
                - 4
              type: integer
              description: 'Sex of the animal: 1=female, 2=male, 3=unknown, 4=castrate. Need to be delivered in case this is known.'
          description: 'An object representing the detailed information of an introduced animal including its name, genetic line, birth details, and parental links.'
        origin:
          required:
            - id
          type: object
          properties:
            id:
              required:
                - id
                - idType
              type: object
              properties:
                id:
                  type: string
                  description: 'The unique identifier of the party, which must not be empty'
                idType:
                  type: string
                  description: 'The type of the party identifier, which provides additional context about the identifier. Type values are defined in code list nl.cl709.'
              description: The id of the origin.
          description: 'An object representing a reference to a farm, encapsulated by an ID model that details the farm''s identifier and the type of that identifier.'
      example:
        eventId: '1234567890'
        dateOfIntroduction: '2023-01-25'
        origin:
          id:
            id: '1302'
            idType: sms
        animal:
          id:
            id: '171069'
            idType: 4
          secondaryIds:
            - idType: 6
              id: 'B4N392'
            - idType: 1
              id: '58921'
            - idType: 2
              id: 'C2459'
          sex: 2
          line:
            id: C
