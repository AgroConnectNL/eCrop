  '/parties/{smsNr}/synchronisations':
    get:
      tags:
        - 50-sync
      summary: 500-synchronisations
      description: 'Sometimes a client is requested by Hypor to resend (synchronise) all of its data from a certain point of time. With a GET a client can check whether Hypor wants him to synchronise.  In case a farm synchronisation (syncType=F) is needed the payload of the response contains numberOfDays to indicate how many days back in time the farm data needs to be synchronised. A synchronisation is based on the current status of the data, so only POSTs from all events are send. More detailed background information can be found in the “Guiding manual for service providers”.'
      operationId: getSynchronisationRequests
      parameters:
        - $ref: '#/components/parameters/smsNr'
        - $ref: '#/components/parameters/User-Agent'
        - $ref: '#/components/parameters/Authorization'
      responses:
        '200':
          description: The new or started syncrhonisation requests for this smsNr.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Synchronisation'
              example:
                id: 00000000-0000-0000-0000-000000000000
                status: 0
                syncType: A
                animalIds:
                  - id: '220376'
                    idType: 4
                  - id: 'Q8T531'
                    idType: 6
                  - id: 'Q8T529'
                    idType: 6
                  - id: '117048'
                    idType: 1
        '401':
          description: When connected party is not authorized/allowed to call this api
        '403':
          description: When connected party is not authorized/allowed to call this api for this smsnr
        '500':
          description: When something bad happened on our side
  '/parties/{smsNr}/synchronisations/{synchronisationId}':
    patch:
      tags:
        - 50-sync
      summary: 501-synchronisations
      description: 'With the PATCH method the vendor (per holder of the pigs using a sow management system (SMS)) informs Hypor on the status of the synchronisation by updating the status of the synchronisation request. The payload of the PATCH-request contains the syncStatus. '
      operationId: patchSynchronisationRequest
      parameters:
        - $ref: '#/components/parameters/smsNr'
        - name: synchronisationId
          in: path
          required: true
          schema:
            type: string
        - $ref: '#/components/parameters/User-Agent'
        - $ref: '#/components/parameters/Authorization'
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SynchronisationPatchRequestModel'
            example:
              status: 4
      responses:
        '200':
          description: The synchronisation request's status is updated.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Synchronisation'
              example:
                id: 00000000-0000-0000-0000-000000000000
                status: 0
                syncType: F
                numberOfDays: 720
                animals:
                  - id:
                      id: '171069'
                      idType: 4
                    secondaryIds:
                      - id: 'B4N392'
                        idType: 6
                      - id: '58921'
                        idType: 1
                      - id: 'C2459'
                        idType: 2
                  - id:
                      id: '171069'
                      idType: 4
                    secondaryIds:
                      - id: 'B4N392'
                        idType: 6
                      - id: '58921'
                        idType': 1
                      - id: 'C2459'
                        idType: 2
