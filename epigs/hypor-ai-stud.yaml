openapi: 3.0.1
info:
  title: AI-stud-data
  description: |-
    Portal for service providers to exchange AI-stud data.

    <a
    href="https://api-developer-dv.hendrix-genetics.com/content/manual_ai_stud_data_Version1.5_Dec2024.pdf"
    class="link">Guiding manual for service providers_AI-stud-data</a>
  version: '1.0'
externalDocs:
  description: Guiding manual for service providers_AI-stud-data
  url: 'https://api-developer-dv.hendrix-genetics.com/content/manual_ai_stud_data_Version1.5_Dec2024.pdf'
tags:
  - name: 01-introductions
    description: Introduction operations
  - name: 15-removals
    description: Removal operations
  - name: 19-observations
    description: Introduction operations
  - name: 20-assessments
    description: Assessment operations
  - name: 50-sync
    description: Synchronisation operations
servers:
  - url: 'https://api-dv.hendrix-genetics.com/breeding/swine/AI-stud'
paths:
  '/parties/{smsNr}/introductions':
    post:
      tags:
        - 01-introductions
      summary: 010-introductions
      description: |-
        Using this operation, animals will be supplied to the mating area of the farm (smsNr). 
        The animals will be in general around 4-7 months of age when they get supplied. 
        In case of females, it can be that rearing gilts within the farm are internally transferred to the mating area. But it can also be that females come from another farm (smsNr). 
        In case of males, it can be that rearing boars within the farm are transferred to the mating area. But it can also be that males come from another farm (smsNr).
      operationId: postIntroduction
      parameters:
        - $ref: '#/components/parameters/smsNr'
        - $ref: '#/components/parameters/User-Agent'
        - $ref: '#/components/parameters/Authorization'
      requestBody:
        description: ''
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Introduction'
            example:
              eventId: '1234567890'
              dateOfIntroduction: '2023-01-25'
              origin:
                id:
                  id: '1302'
                  idType: sms
              animal:
                id:
                  id: '171069'
                  idType: 4
                secondaryIds:
                  - idType: 6
                    id: 'B4N392'
                  - idType: 1
                    id: '58921'
                  - idType: 2
                    id: 'C2459'
                sex: 2
                line:
                  id: C
                dateOfBirth: '2022-07-23'
                mother:
                  id:
                    id: 'Q8T529'
                    idType: 6
                  secondaryIds:
                    - id: '114349'
                      idType: 4
                    - id: '000000117034'
                      idType: 1
                    - id: '47406'
                      idType: 2
                father:
                  id:
                    id: T04Q4
                    idType: 6
                  secondaryIds:
                    - id: '1455289'
                      idType: 4
                    - id: '900092150322612'
                      idType: 1
                boar:
                  type: NBA
                  name: DYNAMITE
      responses:
        '202':
          description: The message is accepted by the backend for further processing
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Introduction'
                  - $ref: '#/components/schemas/Metadata'
              example:
                eventId: '1234567890'
                dateOfIntroduction: '2023-01-25'
                origin:
                  id:
                    id: '1302'
                    idType: sms
                animal:
                  id:
                    id: '171069'
                    idType: 4
                  secondaryIds:
                    - idType: 6
                      id: 'B4N392'
                    - idType: 1
                      id: '58921'
                    - idType: 2
                      id: 'C2459'
                  sex: 2
                  line:
                    id: C
                  dateOfBirth: '2022-07-23'
                  mother:
                    id:
                      id: 'Q8T529'
                      idType: 6
                    secondaryIds:
                      - id: '114349'
                        idType: 4
                      - id: '000000117034'
                        idType: 1
                      - id: '47406'
                        idType: 2
                  father:
                    id:
                      id: 'T04Q4'
                      idType: 6
                    secondaryIds:
                      - id: '1455289'
                        idType: 4
                      - id: '900092150322612'
                        idType: 1
                  boar:
                    type: NBA
                    name: DYNAMITE
                boar:
                  type: NBA
                  name: DYNAMITE
                metadata:
                  senderApplicationId: 123
                  versionNumber: 1.0.0
                  releaseNumber: 1.0.1
                  smsNr: 12345
                  clientId: '123456'
                  requestId: 3f2504e0-4f89-11d3-9a0c-0305e82c3301
                  requestDateTime: '2022-01-01T12:00:00.0000000+00:00'
                  syncId: 3f2504e0-4f89-11d3-9a0c-0305e82c3302
        '400':
          description: When not all required fields are populated (e.g. User-Agent header and payload)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                - memberNames:
                    - AnimalId.Id
                  errorMessage: The value for Id is invalid
                - memberNames:
                    - AnimalId.AnimalIdType
                  errorMessage: The value for Animal Id Type is invalid
                - memberNames:
                    - 'SecondaryAnimalIds[0].AnimalIdType'
                  errorMessage: The value for Animal Id Type is invalid
                - memberNames:
                    - name
                  errorMessage: The name is required when (rearing) boar
        '401':
          description: When connected party is not authorized/allowed to call this api
        '403':
          description: When connected party is not authorized/allowed to call this api for this smsnr
        '500':
          description: When something bad happened on our side
  '/parties/{smsNr}/introductions/{eventId}':
    delete:
      tags:
        - 01-introductions
      summary: 015-introductions
      description: This operation can be used to correct previously sent incorrect introductions. This event will remove the previously sent introduction information.
      operationId: deleteIntroduction
      parameters:
        - $ref: '#/components/parameters/smsNr'
        - name: eventId
          in: path
          description: 'A unique identifier for this occurrence of the introduction This identifier must be a whole number with a maximum length of 10. This unique identifier cannot be re-used within the client software, also not after a DEL operation.'
          required: true
          schema:
            type: string
        - $ref: '#/components/parameters/User-Agent'
        - $ref: '#/components/parameters/Authorization'
      responses:
        '202':
          description: The message is accepted by the backend for deletion
        '400':
          description: When not all required fields are populated (e.g. User-Agent header and payload)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                - memberNames:
                    - string
                  errorMessage: string
        '401':
          description: When connected party is not authorized/allowed to call this api
        '403':
          description: When connected party is not authorized/allowed to call this api for this smsnr
        '500':
          description: When something bad happened on our side
  '/parties/{smsNr}/removals':
