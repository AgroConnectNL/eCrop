  '/parties/{smsNr}/synchronisations':
    get:
      tags:
        - 50-sync
      summary: 500-synchronisations
      description: 'Sometimes a client is requested by Hypor to resend (synchronise) all of its data from a certain point of time. With a GET a client can check whether Hypor wants him to synchronise.  In case a farm synchronisation (syncType=F) is needed the payload of the response contains numberOfDays to indicate how many days back in time the farm data needs to be synchronised. A synchronisation is based on the current status of the data, so only POSTs from all events are send. More detailed background information can be found in the “Guiding manual for service providers”.'
