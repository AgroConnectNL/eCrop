components:
  schemas:
    ErrorResponse:
      type: array
      items:
        $ref: '#/components/schemas/ErrorMessage'
    ErrorMessage:
      required:
        - memberNames
        - errorMessage
      type: object
      properties:
        memberNames:
          type: array
          items:
            type: string
          description: The property on the request object where the errors is applicable
        errorMessage:
          type: string
          description: The error message
    SynchronisationRequestModel:
      required:
        - status
      type: object
      properties:
        status:
          enum:
            - 0
            - 1
            - 4
            - 5
          type: integer
          description: 'The status of the synchronisation. There are different statuses, which are used by the vendor to inform Hypor the status of the synchronisation request. Status 1 = started = indicates that the requested synchronisation is initiated by the vendor. Status 4 = completed = when the full synchronisation at the end is successfully sent to Hypor. When an individual request failed but succeeded after retrying it''s still successful.. Status 5 = completed with errors = when the full synchronisation is completed but some of the API''s are not successful (after retrying!) and thus didn''t reach Hypor.'
      description: 'A model for managing synchronization processes, detailing the sync identifier, status, type, and duration.'
      example:
        status: 4
    FarrowingResponseModel:
      required:
        - eventId
        - dateOfFarrowing
        - sow
        - lastInseminationPerLitterEventId
        - cycleNumber
        - numberOfLivebornPiglets
        - numberOfStillbornPiglets
        - numberOfFemaleLiveborns
        - numberOfMummies
        - balanceCrossFosteredPiglets
      type: object
      properties:
        eventId:
          minLength: 1
          type: string
          description: 'A unique identifier for this occurrence of the farrowing. This identifier must be a whole number with a maximum length of 10. This unique identifier cannot be re-used within the client software, also not after a DEL operation.'
        dateOfFarrowing:
          type: string
          description: The date on which farrowing occurred. This field must have a non-default date value. Format YYYY-MM-DD
          format: date
        sow:
          required:
            - id
            - secondaryIds
          type: object
          properties:
            id:
              required:
                - id
                - idType
              type: object
              properties:
                id:
                  type: string
                  description: 'Identification number of the sow (ManagementSystemId , administrative animal number) must be a whole number between 1 and 99999999. Leading zeros are allowed but will be ignored. This unique identifier cannot be re-used with the client software, also not after a DEL operation.'
                idType:
                  type: integer
                  description: 'The type of the id. Possible values: 4 (ManagementSystemId). Type values are defined in code list nl.cl607.'
              description: The id of the animal.
            secondaryIds:
              type: array
              items:
                required:
                  - id
                  - idType
                type: object
                properties:
                  id:
                    type: string
                    description: The secondary ids of the sow
                  idType:
                    type: integer
                    description: 'Secondary identification of the animal. Possible values: 1 (Electronic ChipNumber), 2 (Tagnumber), 6 (TattooNumber). Type 2 (ear tag number) is required. Electronic chip number (type 1) and other types are non-mandatory, but have to be delivered in case they are known. Type values are defined in code list nl.cl607.'
              description: 'Secondary identification of the animal. Type 2 (ear tag number) is obligated. Electronic chip number (type 1) and other types are non-mandatory, but have to be delivered in case they are known. Type values are defined in code list CL607.'
          description: 'Model detailing the identification of an animal, including primary and secondary IDs.'
        lastInseminationPerLitterEventId:
          type: string
          description: 'Identifier of the last insemination event per litter, if applicable. This identifier must be a whole number with a maximum length of 10. This unique identifier cannot be re-used within the client software, also not after a DEL operation.'
        cycleNumber:
          type: integer
          description: 'Cycle number of the sow at the time of farrowing, roughly 1 till 25. The definition of cycle number can be found in the vendor document.'
        litterNumber:
          type: integer
          description: The number of the litter associated with this farrowing event.
        numberOfLivebornPiglets:
          type: integer
          description: Number of live-born piglets during the farrowing.
        numberOfStillbornPiglets:
          type: integer
          description: Number of stillborn piglets during the farrowing.
        numberOfFemaleLiveborns:
          type: integer
          description: Number of female live-born piglets.
        numberOfMummies:
          type: integer
          description: Number of mummified piglets found during the farrowing.
        balanceCrossFosteredPiglets:
          type: integer
          description: Number of piglets cross-fostered to balance the litter post-farrowing.
        inducedAbortion:
          type: boolean
          description: Flag indicating whether any abortions during the pregnancy leading to this farrowing were induced. Induced abortion is an artificially induced abortion to create a sanitary vacuum.
        metadata:
          type: object
          properties:
            senderApplicationId:
              minimum: 1
              type: integer
              description: The unique identifier of the sender application.
            versionNumber:
              type: string
              description: The version number of the application.
            releaseNumber:
              type: string
              description: 'The release number of the application, if applicable.'
            smsNr:
              minimum: 1
              type: integer
              description: The SMS number associated with the payload.
            clientId:
              pattern: '^[1-9][0-9]*$'
              type: string
              description: The client identifier.
            requestId:
              type: string
              description: The unique identifier for this request.
              format: uuid
            requestDateTime:
              type: string
              description: The date and time when the request was made.
              format: date-time
            syncId:
              type: string
              description: The synchronization identifier used in sync APIs.
              format: uuid
          description: Metadata related to the response.
      example:
        eventId: '9448815'
        dateOfFarrowing: '2021-06-05'
        sow:
          id:
            id: '114349'
            idType: 4
          secondaryIds:
            - idType: 6
              id: Q8T529
            - idType: 1
              id: '117034'
            - idType: 2
              id: '47406'
        lastInseminationPerLitterEventId: '8628815'
        cycleNumber: 1
        litterNumber: 1
        numberOfLiveBornPiglets: 14
        numberOfStillBornPiglets: 3
        numberOfFemaleLiveBorns: 7
        numberOfMummies: 1
        balanceCrossFosteringPiglets: 0
        inducedAbortion: false
        metadata:
          senderApplicationId: 123
          versionNumber: 1.0.0
          releaseNumber: 1.0.1
          smsNr: 12345
          clientId: '123456'
          requestId: 3f2504e0-4f89-11d3-9a0c-0305e82c3301
          requestDateTime: '2022-01-01T12:00:00.0000000+00:00'
          syncId: 3f2504e0-4f89-11d3-9a0c-0305e82c3302
