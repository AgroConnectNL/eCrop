            - 4
            - 5
            - 6
          type: integer
          description: 'Indication of the cause of death: 1=sold, 2=sold to slaughterhouse, 3=pig(let) internal movement, 4=stillborn, 5=natural dead, 6=euthanized. Type values are defined in code list nl.cl664.'
        observerId:
          required:
            - id
            - idType
          type: object
          properties:
