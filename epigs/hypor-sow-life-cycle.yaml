openapi: 3.0.1
info:
  title: Sow life cycle-data
  description: "Portal for service providers to exchange sow life cycle-data.\n\n<a href=\"https://api-developer-dv.hendrix-genetics.com/content/manual_sow-life_cycle_data_Version1.5_Dec2024.pdf\" class=\"link\">Guiding manual for service providers_Sow life cycle-data</a>"
  version: '1.0'
servers:
  - url: https://api-dv.hendrix-genetics.com/breeding/swine/sow-life-cycle
paths:
  '/parties/{smsNr}/introductions':
    post:
      tags:
        - 01-introductions
      summary: 010-introductions
      description: "Using this operation, animals will be supplied to the mating area of the farm (smsNr). \nThe animals will be in general around 4-7 months of age when they get supplied. \nIn case of females, it can be that rearing gilts within the farm are internally transferred to the mating area. But it can also be that females come from another farm (smsNr). \nIn case of males, it can be that rearing boars within the farm are transferred to the mating area. But it can also be that males come from another farm (smsNr)."
      operationId: postIntroduction
      parameters:
        - name: smsNr
          in: path
          description: The smsNr is a unique Hypor farm number given by the Hypor breeding department at the startup of the Hypor data exchange.
          required: true
          schema:
            type: string
        - name: User-Agent
          in: header
          description: 'Indicates which User application is used, needs to be in for following format; ''9999/V2 (V2.1.12)'', Application Sender = 9999 Version Number = V2 Release Number = V2.1.12'
          required: true
          schema:
            type: string
            default: 9999/V2 (V2.1.12)
        - name: Authorization
          in: header
          description: 'Enter the token with the `Bearer ` prefix, e.g. ''Bearer abcde12345'''
          required: true
          schema:
            type: string
      requestBody:
        description: ''
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/IntroductionRequestModel'
            example:
              eventId: '1234567890'
              dateOfIntroduction: '2023-01-25'
              origin:
                id:
                  id: '1302'
                  idType: sms
              animal:
                id:
                  id: '00171069'
                  idType: 4
                secondaryIds:
                  - idType: 6
                    id: B4N392
                  - idType: 1
                    id: '00000058921'
                  - idType: 2
                    id: C2459
                sex: 2
                line:
                  id: C
                dateOfBirth: '2022-07-23'
                mother:
                  id:
                    id: Q8T529
                    idType: 6
                  secondaryIds:
                    - id: '114349'
                      idType: 4
                    - id: '000000117034'
                      idType: 1
                    - id: '47406'
                      idType: 2
                father:
                  id:
                    id: T04Q4
                    idType: 6
                  secondaryIds:
                    - id: '1455289'
                      idType: 4
                    - id: '0900092150322612'
                      idType: 1
                boar:
                  type: NBA
                  name: DYNAMITE
      responses:
        '202':
          description: The message is accepted by the backend for further processing
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IntroductionResponseModel'
              example:
                eventId: '1234567890'
                dateOfIntroduction: '2023-01-25'
                origin:
                  id:
                    id: '1302'
                    idType: sms
                animal:
                  id:
                    id: '00171069'
                    idType: 4
                  secondaryIds:
                    - idType: 6
                      id: B4N392
                    - idType: 1
                      id: '00000058921'
                    - idType: 2
                      id: C2459
                  sex: 2
                  line:
                    id: C
                  dateOfBirth: '2022-07-23'
                  mother:
                    id:
                      id: Q8T529
                      idType: 6
                    secondaryIds:
                      - id: '114349'
                        idType: 4
                      - id: '000000117034'
                        idType: 1
                      - id: '47406'
                        idType: 2
                  father:
                    id:
                      id: T04Q4
                      idType: 6
                    secondaryIds:
                      - id: '1455289'
                        idType: 4
                      - id: '0900092150322612'
                        idType: 1
                  boar:
                    type: NBA
                    name: DYNAMITE
                boar:
                  type: NBA
                  name: DYNAMITE
                metadata:
                  senderApplicationId: 123
                  versionNumber: 1.0.0
                  releaseNumber: 1.0.1
                  smsNr: 12345
                  clientId: '123456'
                  requestId: 3f2504e0-4f89-11d3-9a0c-0305e82c3301
                  requestDateTime: '2022-01-01T12:00:00.0000000+00:00'
                  syncId: 3f2504e0-4f89-11d3-9a0c-0305e82c3302
        '400':
          description: When not all required fields are populated (e.g. User-Agent header and payload)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                - memberNames:
                    - AnimalId.Id
                  errorMessage: The value for Id is invalid
                - memberNames:
                    - AnimalId.AnimalIdType
                  errorMessage: The value for Animal Id Type is invalid
                - memberNames:
                    - 'SecondaryAnimalIds[0].AnimalIdType'
                  errorMessage: The value for Animal Id Type is invalid
                - memberNames:
                    - name
                  errorMessage: The name is required when (rearing) boar
        '401':
          description: When connected party is not authorized/allowed to call this api
        '403':
          description: When connected party is not authorized/allowed to call this api for this smsnr
        '500':
          description: When something bad happened on our side
  '/parties/{smsNr}/introductions/{eventId}':
    delete:
      tags:
        - 01-introductions
      summary: 015-introductions
      description: This operation can be used to correct previously sent incorrect introductions. This event will remove the previously sent introduction information.
      operationId: deleteIntroduction
      parameters:
        - name: smsNr
          in: path
          description: The smsNr is a unique Hypor farm number given by the Hypor breeding department at the startup of the Hypor data exchange.
          required: true
          schema:
            type: string
        - name: eventId
          in: path
          description: 'A unique identifier for this occurrence of the introduction This identifier must be a whole number with a maximum length of 10. This unique identifier cannot be re-used within the client software, also not after a DEL operation.'
          required: true
          schema:
            type: string
        - name: User-Agent
          in: header
          description: 'Indicates which User application is used, needs to be in for following format; ''9999/V2 (V2.1.12)'', Application Sender = 9999 Version Number = V2 Release Number = V2.1.12'
          required: true
          schema:
            type: string
            default: 9999/V2 (V2.1.12)
        - name: Authorization
          in: header
          description: 'Enter the token with the `Bearer ` prefix, e.g. ''Bearer abcde12345'''
          required: true
          schema:
            type: string
      responses:
        '202':
          description: The message is accepted by the backend for deletion
        '400':
          description: When not all required fields are populated (e.g. User-Agent header and payload)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                - memberNames:
                    - string
                  errorMessage: string
        '401':
          description: When connected party is not authorized/allowed to call this api
        '403':
          description: When connected party is not authorized/allowed to call this api for this smsnr
        '500':
          description: When something bad happened on our side
