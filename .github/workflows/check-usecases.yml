name: Check use case structure

on:
  push:
    branches: [main]
    paths:
      - "usecases/**"
      - "scripts/check-usecases-structure.js"
      - ".github/workflows/check-usecases.yml"
  pull_request:
    paths:
      - "usecases/**"
      - "scripts/check-usecases-structure.js"
      - ".github/workflows/check-usecases.yml"
  workflow_dispatch:

jobs:
  check-structure:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Check required section headings
        run: node scripts/check-usecases-structure.js
