name: Validate OpenAPI spec

on:
  push:
    branches: [main]
    paths:
      - "openapi/**"
  pull_request:
    paths:
      - "openapi/**"

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Lint with Redocly CLI
        run: npx --yes @redocly/cli lint openapi/ecrop.yaml
