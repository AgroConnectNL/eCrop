name: Publish docs

on:
  # GitHub Pages isn't enabled for this repo yet (Settings → Pages → Source:
  # GitHub Actions). Once it is, uncomment the push trigger below so docs
  # publish automatically again.
  # push:
  #   branches: [main]
  #   paths:
  #     - "docs/**"
  #     - "openapi/**"
  workflow_dispatch:

permissions:
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Assemble site
        run: |
          mkdir -p site/docs site/openapi
          cp -r docs/. site/docs/
          cp -r openapi/. site/openapi/
          printf '<meta http-equiv="refresh" content="0; url=docs/index.html">' > site/index.html
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
