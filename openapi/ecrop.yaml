openapi: 3.0.4
servers:
  - url: 'https://standard-api.agroconnect.nl/ecrop/v1'
    description: Agroconnect Virtual API server
info:
  description: "## eCrop API based on the **AgroConnect eCrop standard**\r\n\r\nThis API concerns registration of crop related activities like application of crop protection products and fertilizers and energy and water consumption.\r\n\r\n## Conformation\r\nThis API definition follows the rules of the [AgroConnect AGRI API Style Guide](https://github.com/AgroConnectNL/API-Style-Guide/blob/main/API%20Style%20Guide%20Documentation/AGRI%20API%20Style%20Guide.md)\r\n\r\nThis API definition is based on the [AgroConnect eCrop model version 1.1.1](https://www.agroconnect.nl/Portals/10/EnterpriseArchitect/eCrop_json/eCrop_v1.1.1/index.html)\r\n\r\n## Design decisions\r\nThe general principles by which the eCrop class model is transferred to this OpenAPI definition are described in the [design decisions](https://github.com/AgroConnectNL/eCrop/blob/main/openapi/design-decisions.md).\r\n\r\n## Release notes\r\nSee the [changelog](https://github.com/AgroConnectNL/eCrop/blob/main/CHANGELOG.md) for the release notes of each version.\r\n\r\nCopyright (c) AgroConnect 2026"
  version: 1.1.0
  title: AgroConnect eCrop API
  contact:
    email: bernard@vanraaijadvies.nl
    name: Bernard van Raaij
    url: ''
  license:
    name: CC BY 4.0
    url: 'https://creativecommons.org/licenses/by/4.0/'
  termsOfService: ''
externalDocs:
  description: AgroConnect eCrop repository (specification, documentation and business cases).
  url: 'https://github.com/AgroConnectNL/eCrop'
tags:
  - name: general
    description: General Operations
  - name: parties
    description: "**Operations on Party-level**\r\n\r\nThese operations are added to this API definition as an example of how basic party information can be exposed to external clients. This can be extended with functions for registering new parties (growers, suppliers) or letting them modify their basic information (name, address, contact info, etc.)"
  - name: plots
    description: "**Plot operations**\r\n\r\nThese operations can be used to retrieve and maintain the basic (non-geo) information of plots. The geo-information of a plot (boundary, entryPoint, abLine) is not part of these operations; it is published separately via the OGC API Features / JSON-FG operations in the **plot-geometry** section."
  - name: plot-geometry
    description: "**Plot geo-information operations (OGC API Features / JSON-FG)**\r\n\r\nThese operations expose the geo-information of plots (boundary, entryPoint, abLine) as an OGC API Features-compliant, JSON-FG capable API: a landing page, conformance declaration, collection metadata, and Feature/FeatureCollection resources."
  - name: crops
    description: "**Crop operations**\r\n\r\nThese operations can be used to retrieve and maintain crop information."
  - name: delivery
    description: "**Inbound Delivery Operations**\r\n\r\nThese operations can be used for registering products which have been delivered to a grower by a supplier. Suppliers can only register deliveries for growers they are granted for, which they can check with the GET operations in this section (optional). Alternatively growers can register their inboud-deliveries themselves"
  - name: farm level registration
    description: "**Farm level registration Operations**\r\n\r\n These operations can be used to register (non-crop related-) tasks and operations on **farm** level"
  - name: plot level registration
    description: "**Plot level registration Operations**\r\n\r\n These operations can be used to register (non-crop related-) tasks and operations on **plot** level"
  - name: crop level registration
    description: "**Crop level registration Operations**\r\n\r\n These operations can be used to register **crop related** tasks and operations"
  - name: footprint
    description: "**PefCR Footprint reporting Operations**\r\n\r\n These operations can be used to report and retrieve footprint information according to the PefCR standard."
paths:
  /health:
    parameters:
      - $ref: '#/components/parameters/Major-Version'
      - $ref: '#/components/parameters/User-Agent'
    get:
      summary: Returns health check of this API
      operationId: get-health
      x-usecases: [all]
      description: |-
        This endpoint provides health status information about the API service, its dependencies, and overall operational condition. It is designed to be used by monitoring tools, load balancers, and orchestration systems to determine if the service is available and ready to process requests.

        **Checks (examples):**
        - Validator (function) app available?
        - API datastore available?
        - Servicebus available? 

        **Usage:**   
        - **Monitoring:** Used by system administrators and automated monitoring to ensure service availability.
      tags:
        - general
      responses:
        '200':
          $ref: '#/components/responses/health_200'
        '400':
          $ref: '#/components/responses/default_400'
        '401':
          $ref: '#/components/responses/default_401'
        '500':
          $ref: '#/components/responses/default_500'
        '503':
          $ref: '#/components/responses/health_503'
        default:
          $ref: '#/components/responses/default_error'
  /openapi.json:
    get:
      summary: Retrieve this OpenAPI Specification document
      operationId: get-openapi-json
      x-usecases: [all]
      description: |-
        Returns this OpenAPI Specification document (this file, in JSON form), per the NLGov API Design Rules `/core/publish-openapi` requirement. Intended for automated discovery and API catalog tooling, so unlike other operations in this API it does not require the `Major-Version`/`User-Agent` headers, and CORS is enabled so it can be fetched directly from a browser.
      tags:
        - general
      responses:
        '200':
          $ref: '#/components/responses/openApiJson_200'
        '400':
          $ref: '#/components/responses/default_400'
        '500':
          $ref: '#/components/responses/default_500'
        default:
          $ref: '#/components/responses/default_error'
