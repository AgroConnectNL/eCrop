    InboundDeliveryDetails:
      title: Inbound Delivery details
      type: object
      description: |
        Details of materials and inputs delivered by a supplier to a grower as input for their crop process. An inbound
        delivery describes a certain amount of a certain product acquired by a grower through an order to
        a supplier.
      required:
        - thirdPartyIds
        - dateOfDelivery
        - quantity
        - product
        - location
      properties:
        thirdPartyIds:
          allOf:
            - $ref: '#/components/schemas/ThirdPartyIdsType'
          description: 'List of alternative identifiers (\"AKA, also-know-as\") with which the inbound delivery is identified by third parties.'
        dateOfDelivery:
          allOf:
            - $ref: '#/components/schemas/DateType'
          description: Date at which the product is delivered at the location of the grower ("YYYY-MM-DD")
        quantity:
