  ##########################################################################
  # default HTTP-response headers                                          #
  ##########################################################################
  headers:
    API-Version:
      schema:
        type: string
        example: 1.3.2
      description: Full API version
    Request-Id:
      schema:
        type: string
        format: uuid
        example: 3f2504e0-4f89-11d3-9a0c-0305e82c3301
      description: Unique serverside assigned id of the request
    Request-Date-Time:
      schema:
        allOf:
          - $ref: '#/components/schemas/DateTimeType'
        example: '2025-08-16T09:16:22.847Z'
      description: 'Timestamp of the request (YYYY-MM-DDThh:mm:ss.sssZ)'
    Content-Crs:
      schema:
        type: string
      description: 'URI, in angle brackets, of the CRS used for the geometry in the response body, per OGC API - Features - Part 2: CRS by Reference.'
      example: '<http://www.opengis.net/def/crs/EPSG/0/28992>'
    Access-Control-Allow-Origin:
      schema:
        type: string
        example: '*'
      description: 'Allows this response to be fetched cross-origin from any origin, per the NLGov API Design Rules `/core/publish-openapi` requirement.'
    Link:
      schema:
        type: string
      description: >-
        One or more RFC 8288 Web Links (comma-separated when more than one is present). On paginated list
        responses, conveys navigation to adjacent pages (rel=first/prev/next/last) per the Logius API pagination
        standard (https://logius-standaarden.github.io/API-mod-pagination/); absent relations (e.g. "prev" on the
        first page, or "next" on the last) are omitted. On plot-geometry responses, identifies the GeoJSON profile
        used in the response body, per the JSON-FG "GeoJSON Profiles" requirements class. See the API description's
        Design decisions for example values of both usages.