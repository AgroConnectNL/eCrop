    # sections
    CropSection:
      title: Crop section of the Footprint declaration
      type: object
      description: All relevant crop data as part of the PefCR calculation for one crop of one grower in one year
      required:
        - plantSpecies
        - additionalQuestions
      properties:
        plantSpecies:
          allOf:
            - $ref: '#/components/schemas/PlantSpecies'
          description: Crop on which the footprint declaration is based.
        additionalQuestions:
          type: array
          items:
            $ref: '#/components/schemas/CharacteristicType'
          description: Additional questions about the crop for PefCR footprint calculation
    LocationSection:
      title: Location section of the Footprint declaration
      type: object
      description: All relevant location data as part of the PefCR calculation for one crop of one grower in one year
      required:
        - location
        - additionalQuestions
      properties:
        location:
          allOf:
            - $ref: '#/components/schemas/ProductionLocationDetails'
          description: Identification of the production location of the grower at which the crop is grown 
        additionalQuestions:
          type: array
          items:
            $ref: '#/components/schemas/CharacteristicType'
          description: Additional questions about the location for PefCR footprint calculation
    CultivationSection:
      title: Cultivation section of the Footprint declaration
      type: object
      description: All relevant cultivation (materials) data as part of the PefCR calculation for one crop of one grower in one year
      required:
        - additionalQuestions
      properties:
        additionalQuestions:
          type: array
          items:
            $ref: '#/components/schemas/CharacteristicType'
          description: 'Additional questions about the used cultivation materials for PefCR footprint calculation'
    CropProtectionSection:
      title: Crop protection section of the Footprint declaration
      type: object
      description: All relevant crop protection data as part of the PefCR calculation for one crop of one grower in one year
      required:
        - cropProtectionApplications
      properties:
        cropProtectionApplications:
          type: array
          description: List of applied crop protection products the footprint is based on.
          items:
            $ref: '#/components/schemas/CropProtectionApplication'
    FertilizerSection:
      title: Fertilizer section of the Footprint declaration
      type: object
      description: All relevant fertilizer data as part of the PefCR calculation for one crop of one grower in one year
      required:
        - fertilizerApplications
        - additionalQuestions
      properties:
        fertilizerApplications:
          type: array
          description: List of (synthetic and organic) fertilizers the footprint is based on.
          items:
            $ref: '#/components/schemas/FertilizerApplication'
        additionalQuestions:
          type: array
          items:
            $ref: '#/components/schemas/CharacteristicType'
          description: Additional questions on fertilizer application for PefCR footprint calculation
    EnergySection:
      title: Energy production and consumption section of the Footprint declaration
      type: object
      description: All relevant energy production and consumption as part of the PefCR calculation for one crop of one grower in one year
      required:
        - energyProductionAndConsumption
        - additionalQuestions
      properties:
        energyProductionAndConsumption:
          type: array
          description: List of energy production and consumption per type the footprint is based on.
          items:
            $ref: '#/components/schemas/EnergyProductionAndConsumption'
        additionalQuestions:
          type: array
          items:
            $ref: '#/components/schemas/CharacteristicType'
          description: Additional questions on energy production and consumption for PefCR footprint calculation
    WaterConsumptionSection:
      title: Water Consumption section of the Footprint declaration
      type: object
      description: All relevant water consumption data as part of the PefCR calculation for one crop of one grower in one year
      required:
        - waterConsumptions
        - additionalQuestions
      properties:
        waterConsumptions:
          type: array
          description: List of water consumptions per type the footprint is based on.
          items:
            $ref: '#/components/schemas/WaterConsumption'
        additionalQuestions:
          type: array
          items:
            $ref: '#/components/schemas/CharacteristicType'
          description: Additional questions on water consumption for PefCR footprint calculation
    WasteSection:
      title: Waste section of the Footprint declaration
      type: object
      description: All relevant waste data as part of the PefCR calculation for one crop of one grower in one year
      required:
        - additionalQuestions
      properties:
        additionalQuestions:
          type: array
          items:
            $ref: '#/components/schemas/CharacteristicType'
          description: 'Additional questions about waste for PefCR footprint calculation'
    DistributionSection:
      title: Distribution section of the Footprint declaration
      type: object
      description: All relevant distribution data as part of the PefCR calculation for one crop of one grower in one year
      required:
        - additionalQuestions
      properties:
        additionalQuestions:
          type: array
          items:
            $ref: '#/components/schemas/CharacteristicType'
          description: 'Additional questions about distribution for PefCR footprint calculation'
    AdditionalProductSection:
      title: Additional product section of the Footprint declaration
      type: object
      description: All relevant additional product consumption data as part of the PefCR calculation for one crop of one grower in one year
      required:
        - additionalProductApplications
        - additionalQuestions
      properties:
        additionalProductApplications:
          type: array
          description: List of additional product applications per type the footprint is based on.
          items:
            $ref: '#/components/schemas/AdditionalProductApplication'
        additionalQuestions:
          type: array
          items:
            $ref: '#/components/schemas/CharacteristicType'
          description: 'Additional questions for PefCR footprint calculation'
    # Specific schemas as part of the sections
    CropProtectionApplication:
      title: Summary of applied crop protection products
      type: object
      description: All relevant crop protection application data as part of the PefCR calculation for one crop of one grower in one year
      required:
        - product
        - quantity
        - substances
      properties:
        product:
          allOf:
            - $ref: '#/components/schemas/ProductDetails'
          description: Details of the applied crop protection product
        quantity:
          allOf:
            - $ref: '#/components/schemas/MeasureType'
          description: Total quantity of the applied crop protection products for a crop for a year by a grower
        substances:
          description: List of total quantities of the applied active substances of this product for a crop for a year by a grower
          type: array
          items:
            type: object
            description: Total quantity of the applied active substance for a crop for a year by a grower
            required:
              - substance
              - quantity
            properties:
              substance:
                allOf:
                  - $ref: '#/components/schemas/SubstanceDetails'
                description: Details of the applied substance
              quantity: 
                allOf:
                  - $ref: '#/components/schemas/MeasureType'
                description: Total quantity of the applied crop protection products for a crop for a year by a grower
    FertilizerApplication:
      title: Summary of applied synthetic fertilizer products
      type: object
      description: All relevant synthetic fertilizer data as part of the PefCR calculation for one crop of one grower in one year
      required:
        - product
        - type
        - quantity
      properties:
        product:
          allOf:
            - $ref: '#/components/schemas/ProductDetails'
          description: Information of the applied fertilizer product
        type:
          allOf:
            - $ref: '#/components/schemas/CodeType'
          description: Type of the applied fertilizer product
        quantity:
          allOf:
            - $ref: '#/components/schemas/MeasureType'
          description: Total quantity of the applied fertilizer for a crop for a year by a grower
        nutrients:
          description: List of total quantities of the applied nutrients of this product for a crop for a year by a grower
          type: array
          items:
            type: object
            description: Total quantity of the applied nutrient for a crop for a year by a grower
            required:
              - nutrient
              - quantity
            properties:
              nutrient:
                allOf:
                  - $ref: '#/components/schemas/NutrientDetails'
                description: Details of the applied nutrient
              quantity: 
                allOf:
                  - $ref: '#/components/schemas/MeasureType'
                description: Total quantity of the applied nutrient of this product for a crop for a year by a grower
    EnergyProductionAndConsumption:
      title: Summary of the energy production and consumption per type
      type: object
      description: All relevant the energy production and consumption data per type as part of the PefCR calculation for one crop of one grower in one year
      required:
        - type
        - quantity
      properties:
        type:
          allOf:
            - $ref: '#/components/schemas/CodeType'
          description: Type of the produced and consumed energy. Codelist id cl902
        quantity:
          allOf:
            - $ref: '#/components/schemas/MeasureType'
          description: Total quantity of the type of produced and consumed energy for a crop for a year by a grower
    WaterConsumption:
      title: Summary of the water consumption per type
      type: object
      description: All relevant the water consumption data per type as part of the PefCR calculation for one crop of one grower in one year
      required:
        - type
        - quantity
      properties:
        type:
          allOf:
            - $ref: '#/components/schemas/CodeType'
          description: Type of the applied water according to codelist nl.agroconnect.codelist.cl060
        quantity:
          allOf:
            - $ref: '#/components/schemas/MeasureType'
          description: Total quantity of the type of water used for a crop for a year by a grower
    AdditionalProductApplication:
      title: Summary of the additional product application per type
      type: object
      description: All relevant the additional product application data per type as part of the PefCR calculation for one crop of one grower in one year
      required:
        - type
        - quantity
      properties:
        type:
          allOf:
            - $ref: '#/components/schemas/CodeType'
          description: Type of the applied additional product according to codelist nl.agroconnect.codelist.cl060
        quantity:
          allOf:
            - $ref: '#/components/schemas/MeasureType'
          description: Total quantity of the additional product used for a crop for a year by a grower
