  ##########################################################################
  # Resource/operation specific requestbodies                              #
  # request bodies are only defined for resources with POST/PUT methods    #
  ##########################################################################
  requestBodies:
    inboundDeliveryRequestByGrower:
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/InboundDeliveryDetailsByGrower'
          examples:
            fertilizer:
              $ref: '#/components/examples/inboundDeliveryDetailsFertilizerByGrower'
            crop protection:
              $ref: '#/components/examples/inboundDeliveryDetailsCropProtectionByGrower'
    inboundDeliveryRequestBySupplier:
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/InboundDeliveryDetails'
          examples:
            fertilizer:
              $ref: '#/components/examples/inboundDeliveryDetailsFertilizerBySupplier'
            crop protection:
              $ref: '#/components/examples/inboundDeliveryDetailsCropProtectionBySupplier'
    cropRequest:
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/CropDetails'
          examples:
            default:
              $ref: '#/components/examples/cropRequest'
    plotRequest:
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/PlotDetails'
          examples:
            default:
              $ref: '#/components/examples/plotRequest'
    taskRequest:
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/TaskDetails'
          examples:
            Example 1:
              $ref: '#/components/examples/taskRequest'
    patchRequest:
      required: true
      content:
        application/json-patch+json:
          schema:
            $ref: '#/components/schemas/JsonPatch'
          examples:
            Change area of an operation:
              $ref: '#/components/examples/patchRequest'
  parameters:
    ##########################################################################
    # default HTTP request header parameters                                 #
    ##########################################################################
    Major-Version:
      name: Major-Version
      in: header
      required: true
      description: Major version of the API (like v1)
      schema:
        type: string
      example: v1
    User-Agent:
      name: User-Agent
      in: header
      required: true
      description: Identification of the client software package using the API
      schema:
        type: string
      example: 9999/V2 (V2.1.12)
    ##########################################################################
    # default query parameters                                               #
    ##########################################################################
    page:
      # page-number pagination query parameter for list GETs, per the Logius API pagination standard
      # (https://logius-standaarden.github.io/API-mod-pagination/)
      name: page
      description: '1-based page number of the collection to return, for page-number pagination'
      in: query
      schema:
        type: integer
        format: int32
        minimum: 1
        default: 1
      example: 1
    pageSize:
      # page-number pagination query parameter for list GETs, per the Logius API pagination standard
      # (https://logius-standaarden.github.io/API-mod-pagination/)
      name: pageSize
      description: Maximum number of records to return per page, for page-number pagination
      in: query
      schema:
        type: integer
        format: int32
        minimum: 1
        default: 20
        maximum: 50
      example: 20
    cursor:
      # cursor pagination query parameter for list GETs, per the Logius API pagination standard
      # (https://logius-standaarden.github.io/API-mod-pagination/)
      # Alternative to page/pageSize: an operation MUST use one (and only one) of the two methods.
      name: cursor
      description: Opaque pointer to the current position in the dataset, for cursor pagination. Omit to start from the beginning; use the value from the response Link header's "next" relation to fetch the next page.
      in: query
      schema:
        type: string
      example: eyJpZCI6ICIxMjM0NTY3ODkwIn0
    limit:
      # cursor pagination query parameter for list GETs, per the Logius API pagination standard
      # (https://logius-standaarden.github.io/API-mod-pagination/)
      # Alternative to page/pageSize: an operation MUST use one (and only one) of the two methods.
      name: limit
      description: Maximum number of records to return, for cursor pagination
      in: query
      schema:
        type: integer
        format: int32
        minimum: 1
        default: 20
        maximum: 50
      example: 20
    ##########################################################################
    # OGC API Features / JSON-FG query and path parameters                   #
    ##########################################################################
    profile:
      name: profile
      in: query
      required: false
      description: |
        Selects the GeoJSON profile used for the response, per the JSON-FG "JSON-FG in Web APIs" requirements class. "rfc7946" returns plain GeoJSON without JSON-FG extensions (always WGS84, no place/coordRefSys/time/featureType/conformsTo). "jsonfg" returns JSON-FG Core, with the primary geometry in its native CRS in "place".
      schema:
        type: string
        enum:
          - rfc7946
          - jsonfg
        default: rfc7946
    crs:
      name: crs
      in: query
      required: false
      allowReserved: true
      description: |
        CRS URI in which the response geometry ("place" under profile=jsonfg, or "geometry" under profile=rfc7946 subject to prior arrangement) should be returned, per OGC API - Features - Part 2: CRS by Reference. Defaults to CRS84 (WGS84, longitude/latitude) if not specified.
      schema:
        type: string
        format: uri
        enum:
          - 'http://www.opengis.net/def/crs/OGC/1.3/CRS84'
          - 'http://www.opengis.net/def/crs/EPSG/0/28992'
        default: 'http://www.opengis.net/def/crs/OGC/1.3/CRS84'
    bbox-crs:
      name: bbox-crs
      in: query
      required: false
      allowReserved: true
      description: 'CRS URI in which the bbox parameter values are expressed, per OGC API - Features - Part 2: CRS by Reference. Defaults to CRS84.'
      schema:
        type: string
        format: uri
        default: 'http://www.opengis.net/def/crs/OGC/1.3/CRS84'
    bbox:
      name: bbox
      in: query
      required: false
      description: |
        Only features that intersect this bounding box are selected. Expressed as [minX, minY, maxX, maxY] (or, for a 3D bbox, [minX, minY, minZ, maxX, maxY, maxZ]), in the CRS given by bbox-crs (default CRS84).
      schema:
        type: array
        items:
          type: number
        minItems: 4
        maxItems: 6
      style: form
      explode: false
      example:
        - 5.75
        - 51.94
        - 5.79
        - 51.97
    datetime:
      name: datetime
      in: query
      required: false
      allowReserved: true
      description: |
        Only features whose temporal properties (the JSON-FG "time" member) intersect this instant or interval are selected. A single RFC 3339 date/timestamp denotes an instant; two values separated by "/" denote an interval, where an open start/end is denoted by "..".
      schema:
        type: string
      example: 2024-01-01/2024-12-31
    featureLimit:
      name: limit
      in: query
      required: false
      description: The maximum number of features to return in one response.
      schema:
        type: integer
        format: int32
        minimum: 1
        maximum: 1000
        default: 10
    plotSchemeIdQuery:
      name: plotSchemeId
      in: query
      required: false
      description: |
        The schemeId of the plot's id. Together with plotId it selects the features that refer to that plot (the "backlink" from a plot to its geometry): a plot does not store the id of its feature(s), instead each feature refers to its plot in properties.plotId. Must be used together with plotId.
      schema:
        type: string
      example: com.my-mps.codelist.guid
    plotIdQuery:
      name: plotId
      in: query
      required: false
      description: |
        The content of the plot's id. Together with plotSchemeId it selects the features that refer to that plot. Must be used together with plotSchemeId.
      schema:
        type: string
      example: e7f8a9b0-1c2d-3e4f-5a6b-7c8d9e0f1a2b
    featureId:
      name: featureId
      in: path
      required: true
      description: Identifier of the feature within the collection. Corresponds to the top-level "id" member of the JSON-FG/GeoJSON Feature (not the plotId in "properties").
      schema:
        oneOf:
          - type: string
          - type: number
      example: 384912567
    ##########################################################################
    # default path (URI/template) parameters for identification of resources #
    # remark: because path paramteers used in the same URI must have         #
    # different names, separate path parameters are define for each resource #
    # based on the default schemeId parameter
    ##########################################################################
    schemeId:
      # To be copierd to specific instances of the parameters
      # default SchemeId with which the party is identified, 
      name: schemeId
      in: path
      description: SchemeId with which the <resource> is identified
      required: true
      schema:
        $ref: '#/components/schemas/PrimaryIdSchemeIdType'
      example: com.my-mps.codelist.guid
    growerSchemeId:
      name: growerSchemeId
      in: path
      description: SchemeId of the growerId with which the grower is identified
      required: true
      schema:
        $ref: '#/components/schemas/PrimaryIdSchemeIdType'
      example: com.my-mps.codelist.guid
    growerId:
      name: growerId
      in: path
      description: Unique identification of a grower
      required: true
      schema:
        $ref: '#/components/schemas/PrimaryIdContentType'
      example: e3c8a1b2-4f6e-4a2d-8e3b-9c1d2e3f4a5b
    supplierSchemeId:
