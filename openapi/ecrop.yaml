        name:
          type: string
          description: Name of the party
        personName:
          type: string
          description: Persons name
        phoneNumber:
          type: string
          description: Phone number of the party
        telefaxNumber:
          type: string
          description: Telefax number of the party
        emailAddress:
          type: string
          description: E-mail address of the party
        iban:
          type: string
          description: International Bank Account Number (IBAN) of the party
        websiteUrl:
          type: string
          description: Address of the website of the party
        postalAddress:
          $ref: '#/components/schemas/PostalAddressType'
        visitorsAddress:
          $ref: '#/components/schemas/VisitorsAddressType'
      description: Data about the Party that is involved in producing or processing the crop and or agricultural produce.
    Grower:
      title: Grower
      description: The grower (e.g. the farmer) that is responsible for the cultivation of the crop.
      allOf:
        - $ref: '#/components/schemas/PrimaryId'
        - $ref: '#/components/schemas/GrowerDetails'
    GrowerDetails:
      title: Grower details
      description: The details of the grower (e.g. the farmer) that is responsible for the cultivation of the crop.
      allOf:
        - $ref: '#/components/schemas/PartyDetails'
    Supplier:
      title: Supplier
      description: The supplier who delivers goods to a grower
      allOf:
        - $ref: '#/components/schemas/PrimaryId'
        - $ref: '#/components/schemas/SupplierDetails'
    SupplierDetails:
      title: Supplier details
      description: The details of the supplier who delivers goods to a grower
      allOf:
        - $ref: '#/components/schemas/PartyDetails'
    Contractor:
      title: Contractor
      description: The contractor who performs tasks and operations on behalf of a grower, for the growers he is granted access to
      allOf:
        - $ref: '#/components/schemas/PrimaryId'
        - $ref: '#/components/schemas/ContractorDetails'
    ContractorDetails:
      title: Contractor details
      description: The details of the contractor who performs tasks and operations on behalf of a grower
      allOf:
        - $ref: '#/components/schemas/PartyDetails'
    ProductionLocation:
      title: Production location
      description: The the entity that is responsible for cultivation the crops.
      allOf:
        - $ref: '#/components/schemas/PrimaryId'
        - $ref: '#/components/schemas/ProductionLocationDetails'
    ProductionLocationDetails:
      title: Production location details
      description: The details of the entity that is responsible for cultivation the crops.
      allOf:
        - $ref: '#/components/schemas/PartyDetails'
    AssetDetails:
      title: Asset details
      type: object
      description: |-
        Details of the entity of a tangible object on which operations can be performed.
        E.g.: a crop, a building, a machine, a ditch, a greenhouse, a climate control system, a feeding system, etc.
      required:
        - thirdPartyIds
        - name
      properties:
        thirdPartyIds:
          description: 'List of alternative identifiers (\"AKA, also-know-as\") with which the asset is identified by third parties'
          allOf:
            - $ref: '#/components/schemas/ThirdPartyIdsType'
        name:
          type: string
        startDate:
          description: The start data of the existence of the asset.
          allOf:
            - $ref: '#/components/schemas/DateType'
        endDate:
          description: The end data of the existence of the asset.
          allOf:
            - $ref: '#/components/schemas/DateType'
        characteristics:
          type: array
          items:
            $ref: '#/components/schemas/CharacteristicType'
    Crop:
      title: Crop
      description: 'The cultivation of a specific crop type (e.g. potato, wheat, rice,. etc.) on one or more plots during a specific period of time, specified by startDateTime and endDateTime.'
      allOf:
        - $ref: '#/components/schemas/PrimaryId'
        - $ref: '#/components/schemas/CropDetails'
    CropDetails:
      title: Crop details
      description: 'The details of the cultivation of a specific crop type (e.g. potato, wheat, rice,. etc.) on one or more plots during a specific period of time, specified by startDateTime and endDateTime.'
      allOf:
        - $ref: '#/components/schemas/AssetDetails'
        - type: object
          required:
            - year
            - plantSpecies
          properties:
            year:
              type: integer
              format: int32
              description: Indication of the year in which the cultivation is harvested.
            country:
              description: 'Country where crop is grown. Code list: ISO country code: 2 letter ISO-3166.'
              allOf:
                - $ref: '#/components/schemas/CountryCodeType'
            region:
              type: string
              description: Region of a country the cultivation took place.\nFor eCrop in The Netherlands for this code list code list nl.cl044 is used.
            useTitle:
              description: Code to indicate the type of legal ownership of the field that is used for the crop. For eCrop in The Netherlands code list nl.cl412 is used for this
              allOf:
                - $ref: '#/components/schemas/CodeType'
            productionType:
              description: 'Indicates the intensity of growing the crop. In The Netherlands used to report to the MLNV-RVO authority. Code list: nl.cl255'
              allOf:
                - $ref: '#/components/schemas/CodeType'
            productionPurpose:
              description: 'Indicator of the produce purpose the crop. For instance: fresh marked, animal feed, seed production, etc. Code list: nl.cl251'
              allOf:
                - $ref: '#/components/schemas/CodeType'
            productionSequence:
              $ref: '#/components/schemas/ProductionSequenceType'
            regularOrOrganic:
              description: 'Production protocol: indicates whether this crop is classified as grown organic or non-organic. Code list: nl.cl015'
              allOf:
                - $ref: '#/components/schemas/CodeType'
            netArea:
              description: 'The net (netto) area (in m2, hectare, etc.) of the surface that is used for growing the crop.'
              allOf:
                - $ref: '#/components/schemas/MeasureType'
            growEnvironment:
              description: 'Indicates in what type of environment the crop is grown; e.g. in the open air, in a greenhouse, etc. Code list: nl.cl299'
              allOf:
                - $ref: '#/components/schemas/CodeType'
            growMedium:
              description: 'Indicates in what medium the crop is rooted; for instance in soil, in substrate, on bark, etc. Code list: nl.cl300'
              allOf:
                - $ref: '#/components/schemas/CodeType'
            trackTillage:
              type: boolean
              description: 'Indicates whether the cultivation, over the years, is done in fixed lanes with fixed tracks for machinery.\n\ntrue = track tillage is applied\nfalse = track tillage is not applied'
            plantSpecies:
              type: array
              items:
                $ref: '#/components/schemas/PlantSpecies'
            plots:
              type: array
              items:
                $ref: '#/components/schemas/Plot'
    PlantSpecies:
      title: Plant species
      type: object
      description: |-
        Crop type at the level of potato, sugar beet, onion, winter wheat, etc.
        For mixed crops more then one type of crop can be grown in the same period at the same plot.
      required:
        - species
      properties:
        species:
          description: 'Code of the plant species, at the aggregation level of potato, sugar beet, onion, etc. For eCrop in The Netherlands, code list nl.cl263 is used for crop species.'
          allOf:
            - $ref: '#/components/schemas/CodeType'
        variety:
          description: Identification of the variety of the type of crop that is grown. For eCrop in The Netherlands code list nl.cl232 is used.
          allOf:
            - $ref: '#/components/schemas/CodeType'
        percentageInMix:
          description: To be used in case of a mixed crop. Indicator of the percentage of this crop species related to the other crop species that are part of this mixed crop. The percentage is based on the weight proportions of the seed of each of the species that are part of the mixed crop.
          type: number
          format: float
    Plot:
      title: Plot
      description: |-
        Surface (area) that is used to grow plants.
        The exact location of this surface is specified by either, a greenhouse-location a point location or a border location (using outer and inner polygons).

        The geo-information of a plot is published via the plot-geometry operations. A plot does not store the id of its feature(s): the link with rel `https://ecrop.agroconnect.nl/rel/plot-features` in the `links` of a Plot response is a query for the features that refer to this plot (a "backlink"), see GET /collections/plots/items.
      allOf:
        - $ref: '#/components/schemas/PrimaryId'
        - $ref: '#/components/schemas/PlotDetails'
    PlotDetails:
      title: Plot details
      description: |-
        Details of the Surface (area) that is used to grow plants.
        The exact location of this surface is specified by either, a greenhouse-location a point location or a border location (using outer and inner polygons).
      allOf:
        - $ref: '#/components/schemas/AssetDetails'
        - type: object
          required:
            - type
            - area
            - regulatorySoilType
          properties:
            type:
              $ref: '#/components/schemas/PlotType'
            area:
              description: 'The surface (measured in for instance square meters, hectare) of this production plot.'
              allOf:
                - $ref: '#/components/schemas/MeasureType'
            regularOrOrganic:
              description: "Indicates whether this plot is classified for organic production or not.\r\nProduction protocol: indicates whether this plot is classified  for organic production or not.\r\nCode list: nl.cl015"
              allOf:
                - $ref: '#/components/schemas/CodeType'
            localSoilType:
              description: "Code for the soil type, as used for a specific use case.\r\nLocalSoilType code consists of the reference to the code list that is being used plus the code from this code list.\r\nFor eCrop in arable farming in The Netherlands, code list nl.cl405 is used"
              allOf:
                - $ref: '#/components/schemas/CodeType'
            regulatorySoilType:
              description: "Code for the soil type, as subscribed by a regulatory authority (e.g. MLNV-RVO in the Netherlands).\r\nFor eCrop in The Netherlands code list nl.cl405 is used."
              allOf:
                - $ref: '#/components/schemas/CodeType'
            alternativeName:
              type: string
              description: "Option to include a second, alternative, name for the plot.\r\nFor instance to be used to include the name the farmer registered in his FMIS and the name that is registered in the RVO-database."
            region:
              type: string
              description: The region the plot is located in.
            country:
              description: The country the plot is located in.
              allOf:
                - $ref: '#/components/schemas/CountryCodeType'
            landUseCategory:
              description: "The land use category of this plot.\r\nCode list: nl.agroconnect.codelist.cl961. Possible values: ARL (Arable Land), GRL (Grassland), FLL (Fallow Land) and NTA (Natural Area)."
              allOf:
                - $ref: '#/components/schemas/CodeType'
            greenhouseLocation:
              $ref: '#/components/schemas/GreenhouseLocationDetails'
    GreenhouseLocationDetails:
      title: Greenhouse location details
      description: Structure with transparent walls and roof designed to regulate temperature and humidity for growing plants.
      type: object
      required:
        - thirdPartyIds
        - name
      properties:
        thirdPartyIds:
          description: 'List of alternative identifiers (\"AKA, also-know-as\") with which the greenhouse is identified by third parties'
          allOf:
            - $ref: '#/components/schemas/ThirdPartyIdsType'
        name:
          type: string
          description: Name of the greenhouse
        blockId:
          type: string
          description: 'Identifier of a block (in Dutch: afdeling) within the greenhouse.'
        postId:
          type: string
          description: 'Identifier of a post (in Dutch: paal) within the block of the greenhouse'
        upToPostId:
          type: string
          description: "Identifier of a second post (in Dutch: paal) within the block of the greenhouse.\r\nThe upToPost can be used to refer to the location between two posts (postId and upToPostId)."
        waterTapId:
          type: string
          description: 'Identifier of a watertap (in Dutch: waterpunt) within a greenhouse.'
        hortivationpointBlock:
          type: string
          description: Coordinates of the standard Hortivation location reference point for the block
        xyzReferenceToHotivationPoint:
          type: string
          description: The xyz-position to the standard Hortivationpoint of this block within a greenhouse
    LandingPage:
      allOf:
        - type: object
          description: 'Landing page of an OGC API Features-compliant API, per OGC API - Features - Part 1: Core, Requirement /req/core/root-op.'
          properties:
            title:
              type: string
              example: AgroConnect eCrop Plot Features API
            description:
              type: string
              example: 'OGC API Features / JSON-FG publication of plot geo-information (boundary, entryPoint, abLine).'
        - $ref: '#/components/schemas/Links'
      example:
        title: AgroConnect eCrop Plot Features API
        description: 'OGC API Features / JSON-FG publication of plot geo-information (boundary, entryPoint, abLine).'
        links:
          - rel: self
            href: 'https://standard-api.agroconnect.nl/plot-features/v1/'
            type: application/json
          - rel: service-desc
            href: 'https://standard-api.agroconnect.nl/plot-features/v1/api'
            type: application/vnd.oai.openapi+json;version=3.0
          - rel: conformance
            href: 'https://standard-api.agroconnect.nl/plot-features/v1/conformance'
            type: application/json
          - rel: data
            href: 'https://standard-api.agroconnect.nl/plot-features/v1/collections'
            type: application/json
    ConformanceDeclaration:
      type: object
      description: 'List of conformance classes implemented by this API, per OGC API - Features - Part 1: Core, Requirement /req/core/conformance-success.'
      required:
        - conformsTo
      properties:
        conformsTo:
          type: array
          items:
            type: string
            format: uri
      example:
        conformsTo:
          - 'http://www.opengis.net/spec/ogcapi-features-1/1.0/conf/core'
          - 'http://www.opengis.net/spec/ogcapi-features-1/1.0/conf/oas30'
          - 'http://www.opengis.net/spec/ogcapi-features-1/1.0/conf/geojson'
          - 'http://www.opengis.net/spec/ogcapi-features-2/1.0/conf/crs'
          - 'http://www.opengis.net/spec/json-fg-1/1.0/conf/core'
          - 'http://www.opengis.net/spec/json-fg-1/1.0/conf/types-schemas'
          - 'http://www.opengis.net/spec/json-fg-1/1.0/conf/profiles'
          - 'http://www.opengis.net/spec/json-fg-1/1.0/conf/api'
    CollectionExtentType:
      type: object
      description: Spatial and temporal extent of a feature collection.
      properties:
        spatial:
          type: object
          properties:
            bbox:
              type: array
              items:
                type: array
                items:
                  type: number
                minItems: 4
                maxItems: 6
            crs:
              type: string
              format: uri
              default: 'http://www.opengis.net/def/crs/OGC/1.3/CRS84'
        temporal:
          type: object
          properties:
            interval:
              type: array
              items:
                type: array
                items:
                  type: string
                  nullable: true
                minItems: 2
                maxItems: 2
            trs:
              type: string
              format: uri
              default: 'http://www.opengis.net/def/crs/OGC/0/GregorianDateTime'
    Collection:
      allOf:
        - type: object
          description: 'Metadata about a single feature collection, per OGC API - Features - Part 1: Core, Requirement /req/core/collection-success.'
          required:
            - id
          properties:
            id:
              type: string
              example: plots
            title:
              type: string
              example: Plots
            description:
              type: string
              example: 'Geo-information (boundary, entryPoint, abLine) of AgroConnect eCrop plots.'
            itemType:
              type: string
              default: feature
              example: feature
            crs:
              type: array
              description: CRSs supported for this collection when requested via the crs query parameter.
              items:
                type: string
                format: uri
              example:
                - 'http://www.opengis.net/def/crs/OGC/1.3/CRS84'
                - 'http://www.opengis.net/def/crs/EPSG/0/28992'
            storageCrs:
              description: The native CRS in which the geometry of this collection is stored.
              allOf:
                - $ref: '#/components/schemas/CoordRefSysType'
              example: 'http://www.opengis.net/def/crs/EPSG/0/28992'
            extent:
              $ref: '#/components/schemas/CollectionExtentType'
        - $ref: '#/components/schemas/Links'
    Collections:
      allOf:
        - type: object
          description: 'List of feature collections available in this API, per OGC API - Features - Part 1: Core, Requirement /req/core/collections-success.'
          required:
            - collections
          properties:
            collections:
              type: array
              items:
                $ref: '#/components/schemas/Collection'
        - $ref: '#/components/schemas/Links'
    # Plotfeature and PlotFeatureCollection schemas to be used in an OGC API Features API
    PlotFeatureProperties:
      type: object
      description: |
        The "properties" member shared by PlotFeatureTopLevel and PlotFeature: essential plot business attributes (plotId, name, area) plus the flat entryPoint and abLine geometries (no place/geometry wrapper, since properties is opaque to JSON-FG-only readers).
      properties:
        plotId:
          description: 'The id of the plot this feature belongs to. This is the only reference between plot and feature that is stored: the plot finds its feature(s) through a query on this property (see the plotSchemeId and plotId query parameters of GET /collections/plots/items).'
          allOf:
            - $ref: '#/components/schemas/PrimaryIdType'
        name:
          type: string
          description: The name of the plot.
          example: 'Tuin1, perceel6'
        area:
          description: 'The surface (measured in for instance square meters, hectare) of this production plot.'
          allOf:
            - $ref: '#/components/schemas/MeasureType'
        entryPoint:
          description: 'Flat GeoJSON geometry (no place/geometry wrapper) describing the entry point of the plot. Coordinates follow the coordRefSys of this feature under profile=jsonfg, or WGS84 under profile=rfc7946.'
          allOf:
            - $ref: '#/components/schemas/PointType'
        abLine:
          description: 'Flat GeoJSON geometry (no place/geometry wrapper) describing the AB reference line of the plot. Coordinates follow the coordRefSys of this feature under profile=jsonfg, or WGS84 under profile=rfc7946.'
          allOf:
            - $ref: '#/components/schemas/LineStringType'
    PlotFeatureTopLevel:
      allOf:
        - type: object
          description: 'A single plot encoded as a top-level JSON-FG Feature, returned as part of an OGC API Feature endpoint.'
          required:
            - type
            - geometry
            - properties
          properties:
            type:
              type: string
              enum:
                - Feature
            id:
              description: 'Unique identifier of the feature. String or number. Under OGC API Features this corresponds to the {featureId} in the resource URI.'
              oneOf:
                - type: string
                - type: number
            conformsTo:
              type: array
              description: JSON-FG conformance classes implemented by this document. Required when profile=jsonfg is used
              items:
                type: string
                format: uri
              example:
                - 'http://www.opengis.net/spec/json-fg-1/1.0/conf/core'
                - 'http://www.opengis.net/spec/json-fg-1/1.0/conf/types-schemas'
            coordRefSys:
              $ref: '#/components/schemas/CoordRefSysType'
            time:
              $ref: '#/components/schemas/JsonFgTimeType'
            place:
              description: |
                Geometry (JSON FG) of the plot (Polygon or MultiPolygon) using the CRS described in coordRefSys. Only applicable for profile=jsonfg. Should not be used for WGS84 coordinates (use geometry in stead)
              allOf:
                - $ref: '#/components/schemas/PlotGeometryType'
              nullable: true
            geometry:
              description: |
                Optional WGS84 fallback geometry (plain GeoJSON) for consumers that support GeoJSON but not JSON-FG. Null when not provided. Constrained to the same geometry types as "place" in this schema. Since this field is required, it is nullable in case WGS84 is nog relevant
              allOf:
                - $ref: '#/components/schemas/PlotGeometryType'
              nullable: true
            featureType:
              description: The type(s) of this feature. Value(s) should be a CURIE or absolute URI referencing an agreed vocabulary (to be determined for AASG).
              oneOf:
                - type: string
                - type: array
                  items:
                    type: string
              example: 'agroconnect:ecrop:plot'
            properties:
              $ref: '#/components/schemas/PlotFeatureProperties'
        - $ref: '#/components/schemas/Links'
    PlotFeature:
      allOf:
        - type: object
          description: 'A single plot encoded as a JSON-FG Feature, returned as part of an OGC API FeatureCollection endpoint.'
          required:
            - type
            - geometry
            - properties
          properties:
            type:
              type: string
              enum:
                - Feature
            id:
              description: 'Unique identifier of the feature. String or number. Under OGC API Features this corresponds to the {featureId} in the resource URI.'
              oneOf:
                - type: string
                - type: number
            time:
              $ref: '#/components/schemas/JsonFgTimeType'
            place:
              description: |
                Geometry (JSON FG) of the plot (Polygon or MultiPolygon) using the CRS described in coordRefSys. Only applicable for profile=jsonfg. Should not be used for WGS84 coordinates (use geometry in stead)
              allOf:
                - $ref: '#/components/schemas/PlotGeometryType'
              nullable: true
            geometry:
              description: |
                Optional WGS84 fallback geometry (plain GeoJSON) for consumers that support GeoJSON but not JSON-FG. Null when not provided. Constrained to the same geometry types as "place" in this schema. Since this field is required, it is nullable in case WGS84 is nog relevant
              allOf:
                - $ref: '#/components/schemas/PlotGeometryType'
              nullable: true
            properties:
              $ref: '#/components/schemas/PlotFeatureProperties'
        - $ref: '#/components/schemas/Links'
    PlotFeatureCollection:
      allOf:
        - type: object
          description: A collection of plots encoded as a JSON-FG FeatureCollection.
          required:
            - type
            - features
          properties:
            type:
              type: string
              enum:
                - FeatureCollection
            conformsTo:
              description: JSON-FG conformance classes implemented by this document. Required when profile=jsonfg is used
              type: array
              items:
                type: string
                format: uri
              example:
                - 'http://www.opengis.net/spec/json-fg-1/1.0/conf/core'
                - 'http://www.opengis.net/spec/json-fg-1/1.0/conf/types-schemas'
            coordRefSys:
              $ref: '#/components/schemas/CoordRefSysType'
            features:
              type: array
              items:
                $ref: '#/components/schemas/PlotFeature'
            numberMatched:
              type: integer
            numberReturned:
              type: integer
            featureType:
              description: The type(s) of this feature. Value(s) should be a CURIE or absolute URI referencing an agreed vocabulary (to be determined for AASG).
              oneOf:
                - type: string
                - type: array
                  items:
                    type: string
              example: 'agroconnect:ecrop:plot'
        - $ref: '#/components/schemas/Links'
      # ── OGC API Features - Part 1: Core resource schemas ─────────────────────
    Task:
      title: Task
      description: |-
        A Task is the execution of one or more Operation's by a ma-machine-system.
        A 'task' consists of one ore more 'operations' that are closely related but involve different assents and resources. All combined operations need to be carried out well coordinated, to execute the task.
        For instance, the task potato harvesting involves: one tractor pulling the potato harvester, 2 units to take care of the transport of the harvested potatoes to the barn, equipment at the barn to unload the transport units and to bring the produce in the storing place.
      allOf:
        - $ref: '#/components/schemas/PrimaryId'
        - $ref: '#/components/schemas/TaskDetails'
    TaskDetails:
      title: Task details
      type: object
      description: |-
        A Task is the execution of one or more Operation's by a ma-machine-system.
        A 'task' consists of one ore more 'operations' that are closely related but involve different assents and resources. All combined operations need to be carried out well coordinated, to execute the task.
        For instance, the task potato harvesting involves: one tractor pulling the potato harvester, 2 units to take care of the transport of the harvested potatoes to the barn, equipment at the barn to unload the transport units and to bring the produce in the storing place.
      required:
        - thirdPartyIds
        - name
        - startDateTime
        - status
        - operations
      properties:
        thirdPartyIds:
          description: 'List of alternative identifiers (\"AKA, also-know-as\") with which the task is identified by third parties.'
          allOf:
            - $ref: '#/components/schemas/ThirdPartyIdsType'
        name:
          type: string
          description: Short name of the task.
        startDateTime:
          description: The date/timestamp of beginning the execution of the task.
          allOf:
            - $ref: '#/components/schemas/DateTimeType'
        endDateTime:
          description: The date/timestamp of the ending of execution the task.
          allOf:
            - $ref: '#/components/schemas/DateTimeType'
        status:
          $ref: '#/components/schemas/ProcessStateType'
        operations:
          type: array
          items:
            $ref: '#/components/schemas/OperationDetails'
        note:
          type: string
          description: Optional free-text note about the task.
    OperationDetails:
      title: Operation details
      type: object
      description: |-
        Activity carried out by man and/or machine as part op the execution of a task. An operation performs a particular OperationTechnique on a particular asset (a crop,a field, a production unit, a batch, etc.) to realize a certain Cultural Practice or Husbandry Practice.
        Examples for CropProduction: The CulturalPractise "weed control"can be realized by one of various OperationTechniques like spraying, row cultivation, manual hoeing, etc.
      required:
        - thirdPartyIds
        - name
        - startDateTime
        - type
        - status
      properties:
        thirdPartyIds:
          description: 'List of alternative identifiers (\"AKA, also-know-as\") with which the operation is identified by third parties.'
          allOf:
            - $ref: '#/components/schemas/ThirdPartyIdsType'
        name:
          type: string
          description: Short name of the operation.
        startDateTime:
          description: The date/timestamp of beginning the execution of the operation.
          allOf:
            - $ref: '#/components/schemas/DateTimeType'
        endDateTime:
          description: The date/timestamp of the ending of execution the operation.
          allOf:
            - $ref: '#/components/schemas/DateTimeType'
        type:
          description: 'The type of operation. Code list Id for arable farming: nl.agroconnect.cl127'
          allOf:
            - $ref: '#/components/schemas/CodeType'
        technique:
          description: 'Examples for Crop Production: The CulturalPractise \"weed control\" can be realized by one of various OperationTechniques like spraying, row cultivation, manual hoeing, etc. \r\nCode list Id for arable farming: nl.cl127 (or nl.cl293)'
          allOf:
            - $ref: '#/components/schemas/CodeType'
        status:
          $ref: '#/components/schemas/ProcessStateType'
        characteristics:
          type: array
          description: The option to attach one or more characteristics about the execution of this operation.
          items:
            $ref: '#/components/schemas/CharacteristicType'
        area:
          description: 'The treated area (hectare, m2) during the execution of this operation. Can be a percentage of the total area or an absolute value (like hectare or square meter).'
          allOf:
            - $ref: '#/components/schemas/MeasureType'
        inputAllocations:
          type: array
          description: 'The option to attach one or more inputs used to execute this operation, such as crop protection products, fertilizer, water, energy, or labor.'
          items:
            $ref: '#/components/schemas/InputAllocationDetails'
        outputAllocations:
          type: array
          description: 'The option to attach one or more outputs resulting from the execution of this operation, such as harvested produce or energy.'
          items:
            $ref: '#/components/schemas/OutputAllocationDetails'
        equipmentAssignments:
          type: array
          description: The option to attach one or more pieces of equipment used to execute this operation.
          items:
            $ref: '#/components/schemas/EquipmentAssignment'
        workerAssignments:
          type: array
          description: The option to attach one or more workers assigned to execute this operation.
          items:
            $ref: '#/components/schemas/WorkerAssignment'
        note:
          type: string
          description: Optional free-text note about the operation.
    AllocationDetails:
      title: Allocation details
      type: object
      description: Details of the generic class (the parent) for input and output allocation.
      required:
        - thirdPartyIds
        - type
        - quantity
        - product
      properties:
        thirdPartyIds:
          description: 'List of alternative identifiers (\"AKA, also-know-as\") with which the allocation is identified by third parties.'
          allOf:
            - $ref: '#/components/schemas/ThirdPartyIdsType'
        name:
          description: Short name for this allocation.
          type: string
        type:
          description: "Indicator for the type of input or output that is used or delivered by this operation. For instance: \r\n- \"FERTIL\" = fertilizer\r\n- \"PROTEC\" = crop protection product\r\n- \"ENERG\" = energy, etc. \r\nFor this AgroConnect code list nl.agroconnect.codelist.cl271 is used."
          allOf:
            - $ref: '#/components/schemas/CodeType'
        quantity:
          description: 'Quantity of the allocation measured in absolute terms, meaning for instance applied liters or kilogram in total for this allocation (so not in liter/hectare of kilogram/hectare).'
          allOf:
            - $ref: '#/components/schemas/MeasureType'
        characteristics:
          type: array
          items:
            $ref: '#/components/schemas/CharacteristicType'
        product:
          description: Product used as allocation in this operation
          allOf:
            - $ref: '#/components/schemas/ProductDetails'
        greenhouseLocation:
          description: The greenhouse location the allocation applies to (optional).
          allOf:
            - $ref: '#/components/schemas/GreenhouseLocationDetails'
        plantSpecies:
          type: array
          description: The plant species the allocation applies to, for instance the species that is planted or sown (optional).
          items:
            $ref: '#/components/schemas/PlantSpecies'
    InputAllocationDetails:
      title: Input allocation details
      description: |-
        One or more inputs used to execute this operation.
        Examples of types of input are: crop protection products, fertilizer, water, energy, labor, etc.
      allOf:
        - $ref: '#/components/schemas/AllocationDetails'
        - type: object
          required:
            - treatmentzone
          properties:
            treatmentzone:
              $ref: '#/components/schemas/TreatmentZoneDetails'
            reason:
              type: string
              description: Short description of the reason why this particular input (e.g. this crop protection product) is used.
            components:
              type: array
              description: 'Specification of the mixed content (mixture of several components) of the input, for instance a fertilizer.'
              items:
                $ref: '#/components/schemas/ComponentDetails'
    ComponentDetails:
      title: Component details
      type: object
      description: 'Specification of one component of the mixed content of a product, for instance a fertilizer.'
      required:
        - code
        - quantity
      properties:
        code:
          description: "Identification of the component of the composed product.\r\nCode list: nl.agroconnect.codelist.cl363"
          allOf:
            - $ref: '#/components/schemas/CodeType'
        name:
          type: string
          description: Name of the component of the composed product.
        quantity:
          description: "Specification of the quantity of this component as part of the composed product.\r\nCould be in terms of a percentage or in terms of a dimension; for instance gram/kilogram or milliliter per liter."
          allOf:
            - $ref: '#/components/schemas/MeasureType'
    OutputAllocationDetails:
      title: Output allocation details
      description: |-
        One or more outputs as the result of the execution of the operation.
        For example harvested produce: potatoes, onions, flowers, vegetables, etc.
        But an output could also be for instance energy.
      allOf:
        - $ref: '#/components/schemas/AllocationDetails'
        - type: object
          required:
            - treatmentzone
          properties:
            treatmentzone:
              $ref: '#/components/schemas/TreatmentZoneDetails'
    TreatmentZoneDetails:
      title: Treatment zone details
      description: Part of the plot which is treated in an operation
      type: object
      required:
        - thirdPartyIds
      properties:
        thirdPartyIds:
          description: 'List of alternative identifiers (\"AKA, also-know-as\") with which the treatment zone is identified by third parties.'
          allOf:
            - $ref: '#/components/schemas/ThirdPartyIdsType'
        characteristics:
          type: array
          items:
            $ref: '#/components/schemas/CharacteristicType'
        area:
          $ref: '#/components/schemas/MeasureType'
        startLocation:
          type: string
          description: "Specification of the beginning of the treatment zone.\r\nFor instance an identifier of a bed of Tulips in an open field."
        endLocation:
          type: string
          description: "Specification of the end of the treatment zone.\r\nFor instance an identifier of a bed of Tulips in an open field."
    InboundDeliveryByGrower:
      title: Inbound Delivery by Grower
      description: |
        Materials and inputs delivered by a supplier to a grower as input for their crop process. An inbound
        delivery describes a certain amount of a certain product acquired by a grower through an order to
        a supplier.
      allOf:
        - $ref: '#/components/schemas/PrimaryId'
        - $ref: '#/components/schemas/InboundDeliveryDetailsByGrower'
    InboundDeliveryBySupplier:
      title: Inbound Delivery by Supplier
      description: |
        Materials and inputs delivered by a supplier to a grower as input for their crop process. An inbound
        delivery describes a certain amount of a certain product acquired by a grower through an order to
        a supplier.
      allOf:
        - $ref: '#/components/schemas/PrimaryId'
        - $ref: '#/components/schemas/InboundDeliveryDetails'
    InboundDeliveryDetailsByGrower:
      title: Inbound Delivery details by a Grower
      description: |
