    FootprintDeclaration:
      title: Footprint Declaration
      type: object
      description: All relevant data for PefCR calculation for one crop at one production location of one grower in one period
      required:
        - id
        - sequenceNumber
        - versionNumber
        - startDate
        - endDate
        - grower
        - cropSection
        - locationSection
        - cultivationSection
        - cropProtectionSection
        - fertilizerSection
        - energySection
        - waterConsumptionSection
        - wasteSection
        - distributionSection
        - additionalProductSection
      properties:
        # General section
        id: 
          allOf:
            - $ref:  '#/components/schemas/IdType'
          description: 'Identification of the footprint declaration as assigned by the data provider.'
        sequenceNumber:
          allOf:
            - $ref: '#/components/schemas/PosInt32Type'
          description: 'Sequence number of the footprint declaration. Grower-identification, year and sequence number uniquely identify a footprint declaration (which can have multiple versions).'
        versionNumber:
          allOf:
            - $ref: '#/components/schemas/PosInt32Type'
          description: 'Version number of the footprint declaration. A footprint declaration, identified by grower, year and sequence number, can have multiple versions; the highest version number is the most recent.'
        versionDateTime:  
          allOf:
            - $ref: '#/components/schemas/DateTimeType'
          description: 'Date-time of publication of the footprint declaration.'
        thirdPartyIds:
          allOf:
            - $ref: '#/components/schemas/ThirdPartyIdsType'
          description: 'Third party identifications of the footprint declaration.'
        startDate:
          allOf:
            - $ref: '#/components/schemas/DateType'
          description: 'Start date of the period the footprint declaration applies to'
        endDate:
          allOf:
            - $ref: '#/components/schemas/DateType'
          description: 'End date of the period the footprint declaration applies to'
        grower:
          allOf:
            - $ref: '#/components/schemas/GrowerDetails'
          description: 'The grower who is owner of the crop the footprint is calculated on'
        # Crop section
        cropSection:
          $ref: '#/components/schemas/CropSection'
        # Location section 
        locationSection:
          $ref: '#/components/schemas/LocationSection'
        # Cultivation materials section
        cultivationSection:
          $ref: '#/components/schemas/CultivationSection'
        # Crop protection application section
        cropProtectionSection:
          $ref: '#/components/schemas/CropProtectionSection'
        # Fertilizer application section (synthetic and organic)
        fertilizerSection:
          $ref: '#/components/schemas/FertilizerSection'
        # Energy consumption and production section
        energySection:
          $ref: '#/components/schemas/EnergySection'
        # Water consumption section
        waterConsumptionSection:
          $ref: '#/components/schemas/WaterConsumptionSection'
        # Waste section
        wasteSection:
          $ref: '#/components/schemas/WasteSection'
        # Product Distribution section
        distributionSection:
          $ref: '#/components/schemas/DistributionSection'
        # Additional sections
        additionalProductSection:
          $ref: '#/components/schemas/AdditionalProductSection'
