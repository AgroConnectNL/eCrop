<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>eCrop API Documentation</title>
  <link rel="stylesheet" href="https://unpkg.com/swagger-ui-dist@5/swagger-ui.css" />
  <style>
    body { margin: 0; }
  </style>
</head>
<body>
  <div id="swagger-ui"></div>
  <script src="https://unpkg.com/swagger-ui-dist@5/swagger-ui-bundle.js"></script>
  <script src="https://unpkg.com/swagger-ui-dist@5/swagger-ui-standalone-preset.js"></script>
  <script>
    // The complete specification, plus (when published) one distribution per business case,
    // listed in ../openapi/distributions.json by scripts/assemble-site.py.
    const complete = { name: 'eCrop - complete specification', url: '../openapi/ecrop.yaml' };

    async function specs() {
      try {
        const response = await fetch('../openapi/distributions.json');
        if (!response.ok) return [complete];
        const list = await response.json();
        return [complete, ...list.map((d) => ({ name: 'eCrop - ' + d.name, url: '../openapi/' + d.url }))];
      } catch (e) {
        return [complete]; // e.g. opened locally without the published distributions
      }
    }

    window.onload = async () => {
      const urls = await specs();
      window.ui = SwaggerUIBundle({
        urls,
        'urls.primaryName': urls[0].name,
        dom_id: '#swagger-ui',
        presets: [SwaggerUIBundle.presets.apis, SwaggerUIStandalonePreset],
        layout: 'StandaloneLayout',
      });
    };
  </script>
</body>
</html>
